<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Эко-Тропа: Сортировка</title>
    <style>
        html {
            height: -webkit-fill-available; /* Фикс для iOS */
        }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #333;
            touch-action: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Самый надежный способ растянуть на весь экран мобильного */
            height: 100vh; 
            height: 100dvh; 
            min-height: -webkit-fill-available;
            width: 100vw;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            transition: filter 0.3s;
        }
        .blur-effect { filter: blur(8px); }

        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
        }

        /* --- ИНТЕРФЕЙС --- */
        .hud-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 220px;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 15px;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            color: white;
            text-shadow: 1px 1px 2px black;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            backdrop-filter: blur(5px);
            transition: all 0.3s;
        }

        /* Адаптация панели под узкие экраны */
        @media (max-width: 768px) {
            .hud-panel {
                top: 10px; right: 10px; left: 10px; /* Растягиваем сверху */
                width: auto;
                flex-direction: row; /* В строку */
                align-items: center;
                padding: 8px 15px;
                height: 50px;
            }
            .hud-row { gap: 5px; font-size: 14px; }
            .score-text, .speed-text { font-size: 16px; }
            #pause-btn { width: auto; font-size: 14px; padding: 5px 10px; }
            #lives-container { margin-top: 0; }
            .life-leaf { width: 30px; height: 30px; }
            
            /* Скрываем подписи на совсем маленьких экранах, оставляем цифры */
            .hud-label { display: none; }
        }

        .hud-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 18px;
        }

        .speed-text { color: #FFEB3B; }
        .score-text { font-size: 20px; }

        #lives-container {
            display: flex;
            justify-content: flex-end;
            height: 40px;
            margin-top: 5px;
            align-items: center;
        }
        .life-leaf {
            width: 40px;
            height: 40px;
            object-fit: contain;
            margin-left: -12px;
            filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.5));
            transition: transform 0.3s;
        }

        #pause-btn {
            background: #FF9800;
            border: 2px solid #fff;
            color: white;
            font-size: 16px;
            padding: 5px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: transform 0.1s;
        }
        #pause-btn:active { transform: scale(0.95); }

        .score-box { display: none; } 

        /* СТАРТОВЫЙ ЭКРАН */
        #start-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 20;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            overflow: hidden;
            background-color: #2E7D32;
        }

        .start-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('IMG/bg_forest.png') no-repeat center bottom;
            background-size: cover;
            filter: blur(6px);
            transform: scale(1.1);
            z-index: -2;
        }
        .start-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.3);
            z-index: -1;
        }
        .start-decor-trash {
            position: absolute;
            bottom: -20px;
            width: 15vw; max-width: 150px;
            filter: blur(2px) brightness(0.8);
            z-index: -1;
        }

        #game-over-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 20;
            pointer-events: auto;
        }

        .btn {
            background: #4CAF50;
            border: none;
            padding: 15px 50px;
            color: white;
            font-size: 24px;
            cursor: pointer;
            border-radius: 15px;
            margin-top: 30px;
            font-weight: bold;
            box-shadow: 0 6px 0 #2E7D32;
            z-index: 10;
        }
        .btn:active { transform: scale(0.95); box-shadow: 0 3px 0 #2E7D32; }
        
        h1 { font-size: 10vw; margin-bottom: 20px; text-align: center; text-shadow: 0 5px 15px rgba(0,0,0,0.8); }
        @media (min-width: 700px) { h1 { font-size: 70px; } }
        
        #pause-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 40px;
            font-weight: bold;
            text-shadow: 0 5px 15px black;
            z-index: 15;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 5px;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="hud-panel">
            <button id="pause-btn">II Пауза</button>
            <div class="hud-row">
                <span class="hud-label">Очки:</span>
                <span id="score-el" class="score-text">0</span>
            </div>
            <div class="hud-row">
                <span class="hud-label">Скорость:</span>
                <span id="speed-el" class="speed-text">1</span>
            </div>
            <div id="lives-container"></div>
        </div>
    </div>

    <div id="pause-overlay" class="hidden">ПАУЗА</div>

    <div id="start-screen">
        <div class="start-bg"></div>
        <div class="start-overlay"></div>
        <img src="IMG/trash_bottle1.png" class="start-decor-trash" style="left: 10%; bottom: 20px; transform: rotate(-15deg);">
        <img src="IMG/trash_can1.png" class="start-decor-trash" style="right: 15%; bottom: 40px; transform: rotate(10deg);">
        <img src="IMG/trash_apple1.png" class="start-decor-trash" style="left: 40%; bottom: -10px; filter: blur(4px);">

        <h1>Эко-Тропа</h1>
        <p style="font-size: 20px; text-shadow: 1px 1px 2px black; text-align: center; max-width: 80%;">Сортируй мусор, спасай лес!</p>
        <button class="btn" id="start-btn">В Путь</button>
    </div>

    <div id="game-over-screen" class="hidden">
        <h1>Конец игры</h1>
        <p id="final-score" style="font-size: 30px;">Твой счет: 0</p>
        <button class="btn" id="restart-btn">Заново</button>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
/**
 * НАСТРОЙКИ
 */
const ASSETS_PATH = 'IMG/'; 
const HORIZON_Y = 0.44; 

const TYPES = {
    ORGANIC: { id: 'organic', color: '#8BC34A', binImg: 'bin_organic.png', prefix: 'trash_apple' },
    PAPER:   { id: 'paper',   color: '#2196F3', binImg: 'bin_paper.png',   prefix: 'trash_newspaper' },
    PLASTIC: { id: 'plastic', color: '#FF9800', binImg: 'bin_plastic.png', prefix: 'trash_bottle' },
    METAL:   { id: 'metal',   color: '#9E9E9E', binImg: 'bin_met.png',     prefix: 'trash_can' },
    GLASS:   { id: 'glass',   color: '#00BCD4', binImg: 'bin_glass.png',   prefix: 'trash_jar' }
};

const AudioSys = {
    ctx: null,
    init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
    playTone(freq, type, duration, vol=0.1) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
    },
    playSuccess() { this.playTone(500, 'sine', 0.1); setTimeout(() => this.playTone(1000, 'sine', 0.2), 100); },
    playError() { this.playTone(150, 'sawtooth', 0.3, 0.2); },
    playPop() { this.playTone(600, 'triangle', 0.05, 0.05); },
    playLevelUp() { 
        this.playTone(400, 'sine', 0.1, 0.2); 
        setTimeout(() => this.playTone(600, 'sine', 0.1, 0.2), 100);
        setTimeout(() => this.playTone(800, 'sine', 0.3, 0.2), 200);
    }
};

const Loader = {
    images: {},
    loadImg(key, src) {
        return new Promise((resolve) => {
            const img = new Image();
            img.src = src;
            img.onload = () => { this.images[key] = { img: img, loaded: true }; resolve(); };
            img.onerror = () => { this.images[key] = { img: null, loaded: false }; resolve(); };
        });
    },
    async init() {
        const promises = [
            this.loadImg('bg', ASSETS_PATH + 'bg_forest.png'), 
            this.loadImg('leaf', ASSETS_PATH + 'leaf.png')
        ];
        for (let key in TYPES) promises.push(this.loadImg(`bin_${TYPES[key].id}`, ASSETS_PATH + TYPES[key].binImg));
        for (let key in TYPES) {
            for (let i = 1; i <= 5; i++) promises.push(this.loadImg(`${TYPES[key].prefix}${i}`, `${ASSETS_PATH}${TYPES[key].prefix}${i}.png`));
        }
        await Promise.all(promises);
    },
    get(key) { return this.images[key]; }
};

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let width, height, cx, cy;

let gameState = {
    score: 0, 
    lives: 5, 
    speedLevel: 1,      
    itemsSorted: 0,     
    speedMultiplier: 1, 
    
    isRunning: false, isPaused: false,
    bins: [], trash: [], particles: [],
    lastTime: 0, spawnTimer: 0
};

class Trash {
    constructor() {
        this.markedForDeletion = false;
        this.baseSpeed = 0.002; 
        this.progress = 0; 

        const keys = Object.keys(TYPES);
        this.type = TYPES[keys[Math.floor(Math.random() * keys.length)]];
        this.skinId = Math.floor(Math.random() * 5) + 1;
        
        this.isDragging = false;
        this.dragX = 0; this.dragY = 0;

        this.startX = cx + (Math.random() - 0.5) * 50; 
        this.targetX = cx + (Math.random() - 0.5) * (width * 0.5); 
    }

    update(dt) {
        if (!this.isDragging) {
            this.progress += this.baseSpeed * gameState.speedMultiplier * (dt / 16);
            if (this.progress > 1.1) {
                this.markedForDeletion = true;
                handleMiss();
            }
        }
    }

    getScreenPos() {
        const scale = this.progress * this.progress;
        const curY = cy + (height - cy) * this.progress;
        const curX = this.startX + (this.targetX - this.startX) * this.progress;
        return { x: curX, y: curY, scale: scale };
    }

    draw(ctx) {
        const pos = this.getScreenPos();
        let drawX = this.isDragging ? this.dragX : pos.x;
        let drawY = this.isDragging ? this.dragY : pos.y;
        let finalScale = this.isDragging ? 1.0 : pos.scale;
        
        if (finalScale < 0.05) return;

        let maxSize = Math.min(height * 0.25, 220);
        let size = maxSize * finalScale; 

        const res = Loader.get(`${this.type.prefix}${this.skinId}`);
        ctx.save();
        ctx.translate(drawX, drawY);
        
        if (!this.isDragging) {
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(0, size/2, size/3, size/6, 0, 0, Math.PI*2);
            ctx.fill();
        }

        if (res && res.loaded) {
            ctx.drawImage(res.img, -size/2, -size/2, size, size);
        } else {
            ctx.fillStyle = this.type.color;
            ctx.beginPath();
            ctx.arc(0, 0, size/2.5, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = 'white';
            ctx.font = `${Math.ceil(40*finalScale)}px Arial`;
            ctx.fillText(this.type.id[0].toUpperCase(), -10, 15);
        }
        ctx.restore();
    }
}

// === КЛАСС BIN (АДАПТИВНЫЙ) ===
class Bin {
    constructor(typeObj, index, total) {
        this.type = typeObj;
        this.recalculate(index, total);
    }

    recalculate(index, total) {
        // Проверяем ориентацию
        const isPortrait = height > width;
        // Проверяем, мобильное ли устройство (грубо: ширина < 800)
        const isMobile = width < 800;

        // СЦЕНАРИЙ 1: ВЕРТИКАЛЬНЫЙ ЭКРАН (ТЕЛЕФОН)
        // Задача: максимально большие баки в один ряд
        if (isPortrait) {
            const margin = 5; // Минимальный отступ
            const availableW = width - (margin * 2);
            const binW = availableW / total; // Растягиваем на всю ширину
            
            this.w = binW - 2; // Почти вплотную
            this.h = this.w * 1.3;
            this.x = margin + (index * binW) + (binW / 2) - (this.w / 2);
            
            // Спускаем ниже, под панель
            this.y = 80; 
        } 
        // СЦЕНАРИЙ 2: ГОРИЗОНТАЛЬНЫЙ МОБИЛЬНЫЙ (2 слева, 3 справа)
        else if (isMobile) {
            // Размеры бака
            this.w = Math.min(width * 0.12, 100);
            this.h = this.w * 1.3;
            this.y = 20;

            const gap = width * 0.3; // Пустота в центре (30%)
            const sideWidth = (width - gap) / 2; // Ширина левой/правой зоны

            if (index < 2) {
                // СЛЕВА (0, 1)
                // Распределяем 2 бака в левой зоне
                const step = sideWidth / 2;
                this.x = (index * step) + (step/2) - (this.w/2);
            } else {
                // СПРАВА (2, 3, 4)
                // Распределяем 3 бака в правой зоне
                // Индекс внутри группы: index - 2 (получим 0, 1, 2)
                const rightIndex = index - 2;
                const step = sideWidth / 3;
                const startX = width - sideWidth;
                this.x = startX + (rightIndex * step) + (step/2) - (this.w/2);
            }
        }
        // СЦЕНАРИЙ 3: ДЕСКТОП (ПК)
        else {
            const rightPanelSpace = 250; 
            const margin = 20;
            const availableW = width - (margin * 2) - rightPanelSpace;
            const binW = availableW / total;
            
            this.w = Math.min(240, binW - 10); 
            this.h = this.w * 1.3;
            this.x = margin + (index * binW) + (binW / 2) - (this.w / 2);
            this.y = 15;
        }
    }
    
    checkHit(x, y) { 
        return x > this.x - 40 && 
               x < this.x + this.w + 40 && 
               y > this.y - 40 && 
               y < this.y + this.h + 40; 
    }
    draw(ctx) {
        const res = Loader.get(`bin_${this.type.id}`);
        if (res && res.loaded) ctx.drawImage(res.img, this.x, this.y, this.w, this.h);
        else {
            ctx.fillStyle = this.type.color;
            ctx.fillRect(this.x, this.y, this.w, this.h);
        }
    }
}

class Particle {
    constructor(x, y, color) {
        this.x = x; this.y = y;
        this.vx = (Math.random() - 0.5) * 20;
        this.vy = (Math.random() - 0.5) * 20;
        this.life = 1.0; this.color = color;
    }
    update() { this.x += this.vx; this.y += this.vy; this.life -= 0.05; }
    draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.beginPath(); ctx.arc(this.x, this.y, 10, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
    }
}

let dragItem = null;

function handleStart(x, y) {
    if (!gameState.isRunning || gameState.isPaused) return;
    
    let candidates = gameState.trash.filter(t => t.progress > 0.3);
    candidates.sort((a,b) => b.progress - a.progress);

    for (let t of candidates) {
        const pos = t.getScreenPos();
        let maxSize = Math.min(height * 0.25, 220);
        let size = maxSize * pos.scale; 
        
        const dx = x - pos.x;
        const dy = y - pos.y;
        
        if (Math.sqrt(dx*dx + dy*dy) < size) { 
            dragItem = t;
            t.isDragging = true;
            t.dragX = x; t.dragY = y;
            AudioSys.playPop();
            break; 
        }
    }
}

function handleMove(x, y) { if (dragItem) { dragItem.dragX = x; dragItem.dragY = y; } }

function handleEnd(x, y) {
    if (dragItem) {
        let hitBin = gameState.bins.find(b => b.checkHit(x, y));
        if (hitBin) {
            if (hitBin.type.id === dragItem.type.id) {
                gameState.score += 10;
                gameState.itemsSorted++;
                AudioSys.playSuccess();
                createParticles(x, y, hitBin.type.color);
                checkLevelUp();
            } else {
                gameState.score = Math.max(0, gameState.score - 5);
                AudioSys.playError();
                createParticles(x, y, '#555');
                triggerShake();
            }
            dragItem.markedForDeletion = true;
        } else {
            dragItem.isDragging = false;
        }
        updateHUD();
        dragItem = null;
    }
}

function checkLevelUp() {
    if (gameState.itemsSorted > 0 && gameState.itemsSorted % 20 === 0) {
        gameState.speedLevel++;
        gameState.speedMultiplier += 0.2; 
        AudioSys.playLevelUp(); 
        triggerBlurEffect();    
        updateHUD();
    }
}

function triggerBlurEffect() {
    canvas.classList.add('blur-effect');
    setTimeout(() => {
        canvas.classList.remove('blur-effect');
    }, 500); 
}

const pauseBtn = document.getElementById('pause-btn');
const pauseOverlay = document.getElementById('pause-overlay');

pauseBtn.onclick = () => {
    gameState.isPaused = !gameState.isPaused;
    if (gameState.isPaused) {
        pauseBtn.textContent = "▶ Продолжить";
        pauseOverlay.classList.remove('hidden');
    } else {
        pauseBtn.textContent = "II Пауза";
        pauseOverlay.classList.add('hidden');
        gameState.lastTime = performance.now(); 
        requestAnimationFrame(loop);
    }
};

window.addEventListener('resize', resize);
canvas.addEventListener('mousedown', e => handleStart(e.clientX, e.clientY));
canvas.addEventListener('mousemove', e => handleMove(e.clientX, e.clientY));
canvas.addEventListener('mouseup', e => handleEnd(e.clientX, e.clientY));
canvas.addEventListener('touchstart', e => { e.preventDefault(); handleStart(e.touches[0].clientX, e.touches[0].clientY); }, {passive: false});
canvas.addEventListener('touchmove', e => { e.preventDefault(); handleMove(e.touches[0].clientX, e.touches[0].clientY); }, {passive: false});
canvas.addEventListener('touchend', e => { e.preventDefault(); handleEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY); });

document.getElementById('start-btn').onclick = startGame;
document.getElementById('restart-btn').onclick = startGame;

function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
    cx = width / 2;
    cy = height * HORIZON_Y; 
    
    // Пересчитываем баки при повороте экрана
    if (gameState.bins.length > 0) {
        gameState.bins.forEach((bin, i) => bin.recalculate(i, gameState.bins.length));
    } else {
        // Если игра не начата, просто создаем массив (но рисовать не будем пока)
        gameState.bins = [];
        let i = 0; const count = Object.keys(TYPES).length;
        for (let key in TYPES) gameState.bins.push(new Bin(TYPES[key], i++, count));
    }
}

function createBins() {
    // Вызывается при старте
    gameState.bins = [];
    let i = 0; const count = Object.keys(TYPES).length;
    for (let key in TYPES) gameState.bins.push(new Bin(TYPES[key], i++, count));
}

function createParticles(x, y, c) { for(let i=0; i<15; i++) gameState.particles.push(new Particle(x, y, c)); }

function handleMiss() { 
    gameState.lives--; 
    AudioSys.playError(); 
    triggerShake(); 
    updateHUD(); 
    if (gameState.lives <= 0) gameOver(); 
}

let shakeTimer = 0;
function triggerShake() { shakeTimer = 15; }

function updateHUD() {
    document.getElementById('score-el').textContent = `${gameState.score}`;
    document.getElementById('speed-el').textContent = `${gameState.speedLevel}`;
    
    const container = document.getElementById('lives-container');
    container.innerHTML = ''; 
    const leafRes = Loader.get('leaf');
    for(let i=0; i < gameState.lives; i++) {
        const img = document.createElement('img');
        if (leafRes && leafRes.loaded) {
            img.src = leafRes.img.src;
        } else {
            img.style.width = '30px';
            img.style.height = '30px';
            img.style.backgroundColor = '#4CAF50';
            img.style.borderRadius = '50%';
        }
        img.className = 'life-leaf';
        container.appendChild(img);
    }
}

function gameOver() {
    gameState.isRunning = false;
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('final-score').textContent = `Итоговый: ${gameState.score}`;
}

function startGame() {
    AudioSys.init();
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('game-over-screen').classList.add('hidden');
    pauseOverlay.classList.add('hidden');
    pauseBtn.textContent = "II Пауза";
    
    gameState = {
        score: 0, 
        lives: 5, 
        speedLevel: 1,      
        itemsSorted: 0,     
        speedMultiplier: 1, 
        
        isRunning: true, isPaused: false,
        bins: [], trash: [], particles: [],
        lastTime: performance.now(), spawnTimer: 0
    };
    
    resize(); // Создаст баки под текущий размер
    updateHUD(); 
    requestAnimationFrame(loop);
}

function loop(time) {
    if (!gameState.isRunning) return;
    if (gameState.isPaused) return; 

    const dt = time - gameState.lastTime;
    gameState.lastTime = time;

    ctx.clearRect(0, 0, width, height);

    const bgRes = Loader.get('bg');
    if (bgRes && bgRes.loaded) {
        const imgRatio = bgRes.img.width / bgRes.img.height;
        const canvasRatio = width / height;
        let drawW, drawH, drawX, drawY;
        if (canvasRatio > imgRatio) {
            drawW = width; drawH = width / imgRatio; drawX = 0; drawY = height - drawH; 
        } else {
            drawW = height * imgRatio; drawH = height; drawX = (width - drawW) / 2; drawY = 0;
        }
        ctx.drawImage(bgRes.img, drawX, drawY, drawW, drawH);
    } else {
        const grad = ctx.createLinearGradient(0, 0, 0, height);
        grad.addColorStop(0, '#87CEEB'); grad.addColorStop(HORIZON_Y, '#ccc'); 
        grad.addColorStop(HORIZON_Y, '#2E7D32'); grad.addColorStop(1, '#1B5E20');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, width, height);
    }

    if (shakeTimer > 0) {
        ctx.save();
        ctx.translate((Math.random()-0.5)*15, (Math.random()-0.5)*15);
        shakeTimer--;
    }

    gameState.spawnTimer += dt;
    
    const spawnInterval = 2500 / gameState.speedMultiplier;
    
    if (gameState.spawnTimer > spawnInterval) {
        gameState.trash.push(new Trash());
        gameState.spawnTimer = 0;
    }
    
    // 1. Обновляем мусор
    let roadTrash = [];
    let draggedTrash = [];

    gameState.trash.forEach(t => {
        t.update(dt);
        if (t.isDragging) draggedTrash.push(t);
        else roadTrash.push(t);
    });
    
    gameState.trash = gameState.trash.filter(t => !t.markedForDeletion);

    // 2. Рисуем мусор на дороге
    roadTrash.sort((a,b) => a.progress - b.progress);
    roadTrash.forEach(t => t.draw(ctx));

    // 3. Рисуем баки
    gameState.bins.forEach(b => b.draw(ctx));

    // 4. Рисуем перетаскиваемый мусор
    draggedTrash.forEach(t => t.draw(ctx));

    gameState.particles.forEach(p => { p.update(); p.draw(ctx); });
    gameState.particles = gameState.particles.filter(p => p.life > 0);

    if (shakeTimer > 0) ctx.restore();
    requestAnimationFrame(loop);
}

Loader.init().then(() => { resize(); console.log("Ready"); });

</script>
