<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Эко-Тропа: Финал</title>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background: #2E7D32; 
            font-family: 'Segoe UI', 'Roboto', Helvetica, Arial, sans-serif; 
            -webkit-font-smoothing: antialiased;
        }
        canvas { display: block; touch-action: none; position: absolute; top: 0; left: 0; }
        
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; pointer-events: none; z-index: 20; }
        
        /* --- СТАБИЛЬНЫЙ ИНТЕРФЕЙС (HUD) --- */
        .hud { 
            pointer-events: auto; 
            background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 100%);
            color: white; 
            padding: 10px 15px; 
            /* Используем GRID для жесткой фиксации элементов */
            display: grid;
            grid-template-columns: 100px 1fr 140px; /* Лево (Очки), Центр (Жизни), Право (Кнопки) */
            align-items: start;
        }

        /* Стиль капсул */
        .stat-capsule {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 16px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            white-space: nowrap;
            backdrop-filter: blur(4px);
            color: white;
            width: fit-content;
        }

        /* Правая часть (Скорость + Кнопки) */
        .hud-right {
            display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
        }
        .control-group { display: flex; gap: 8px; }

        /* Кнопки */
        #mute-btn, #pause-btn-hud { 
            background: rgba(255,255,255,0.2); 
            border: 1px solid rgba(255,255,255,0.6); 
            color: white; border-radius: 12px; cursor: pointer; 
            display: flex; align-items: center; justify-content: center;
            height: 38px;
        }
        #mute-btn { font-size: 20px; width: 40px; }
        #pause-btn-hud { font-size: 14px; font-weight: bold; padding: 0 15px; }

        /* Центральная часть (Жизни) */
        .hud-center { display: flex; justify-content: center; }
        
        .lives-wrapper {
            display: flex; gap: 5px; align-items: center; justify-content: center;
            min-height: 40px;
            /* Подложка для жизней (чтобы не терялись) */
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 30px;
            padding: 5px 15px;
            backdrop-filter: blur(2px);
        }
        
        /* Листочки КРУПНЫЕ */
        .life-leaf { width: 45px; height: 45px; object-fit: contain; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.4)); }

        /* АДАПТИВНОСТЬ ДЛЯ ТЕЛЕФОНА (ПОРТРЕТ) */
        @media (orientation: portrait) {
            .hud {
                display: flex; flex-direction: column; gap: 10px;
            }
            .hud-top-row { 
                display: flex; justify-content: space-between; width: 100%; 
            }
            .hud-center {
                order: 2; width: 100%; margin-top: 5px;
            }
            /* В портрете жизни по центру внизу шапки */
            .lives-wrapper { width: auto; align-self: center; border: 2px solid rgba(255,255,255,0.3); }
            .life-leaf { width: 50px; height: 50px; } /* Еще крупнее на телефоне */
            
            /* Скрываем структуру грида в портрете и переопределяем */
            .hud-right { flex-direction: row; align-items: center; }
        }

        /* ЭКРАНЫ */
        .screen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            display: flex; flex-direction: column; align-items: center; 
            justify-content: flex-start; z-index: 100; color: white; text-align: center; 
        }
        .screen-bg { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: url('IMG/bg_forest.png') no-repeat center center; 
            background-size: cover; filter: blur(8px); z-index: -1; transform: scale(1.1); 
        }
        
        .start-content { margin-top: 15vh; display: flex; flex-direction: column; align-items: center; max-width: 90%; }
        
        h1 {
            color: #76FF03; font-size: 42px; margin: 0 0 20px 0;
            text-shadow: 2px 2px 0 #1B5E20, -1px -1px 0 #1B5E20, 1px -1px 0 #1B5E20, -1px 1px 0 #1B5E20, 1px 1px 0 #1B5E20, 0px 4px 10px rgba(0,0,0,0.5);
        }

        .btn { 
            pointer-events: auto; background: #4CAF50; border: none; 
            padding: 16px 50px; color: white; font-size: 24px; font-weight: bold; 
            border-radius: 18px; cursor: pointer; box-shadow: 0 6px 0 #1B5E20; 
            text-transform: uppercase; letter-spacing: 1px; margin-top: 20px;
        }
        .btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #1B5E20; }
        
        .tut { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-around; align-items: flex-end; }
        .tut-i { display: flex; flex-direction: column; align-items: center; flex: 1; }
        .tut-img { width: 90%; height: auto; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.5)); }
        
        .bin-l { 
            font-size: 13px; font-weight: bold; background: #000; color: #fff; 
            padding: 4px 8px; border-radius: 6px; margin-top: 5px; 
            /* Скрываем надписи на заставке в горизонте, показываем в вертикали скриптом */
        }
        
        .hidden { display: none !important; }
        .speed-val { color: #FFEB3B; margin-left: 5px; }
    </style>
</head>
<body>
    <div id="ui-layer">
        <div class="hud">
            <div class="hud-top-row" style="display:contents"> <div class="stat-capsule" style="grid-column: 1;">
                    ⭐ <span id="stat-text" style="margin-left:5px">0</span>
                </div>
                
                <div class="hud-right" style="grid-column: 3;">
                    <div class="stat-capsule">🚀 <span id="speed-text" class="speed-val">1</span></div>
                    <div class="control-group">
                        <button id="mute-btn">🔊</button>
                        <button id="pause-btn-hud">ПАУЗА</button>
                    </div>
                </div>
            </div>

            <div class="hud-center" style="grid-column: 2;">
                <div class="lives-wrapper">
                    <div id="lives-container"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="start-screen" class="screen">
        <div class="screen-bg"></div>
        <div class="start-content">
            <h1>Эко-Тропа</h1>
            <p style="font-size: 18px; line-height: 1.5; text-shadow: 2px 2px 4px #000; padding: 0 20px; font-weight: 500;">
                Помоги лесу стать чище! <br>
                Нажимай на баки внизу, чтобы отправить в них соответствующий мусор. <br>
                Если мусор пересечет <b>красную линию</b> — лесной листочек завянет.
            </p>
            <button class="btn" id="start-btn">В ПУТЬ</button>
        </div>
        
        <div id="tutorial-bins" class="tut">
            <div class="tut-i"><img src="" data-id="ORG" class="tut-img"><span class="bin-l">Органика</span></div>
            <div class="tut-i"><img src="" data-id="PAP" class="tut-img"><span class="bin-l">Бумага</span></div>
            <div class="tut-i"><img src="" data-id="PLA" class="tut-img"><span class="bin-l">Пластик</span></div>
            <div class="tut-i"><img src="" data-id="MET" class="tut-img"><span class="bin-l">Металл</span></div>
            <div class="tut-i"><img src="" data-id="GLA" class="tut-img"><span class="bin-l">Стекло</span></div>
        </div>
    </div>

    <div id="game-over-screen" class="screen hidden" style="justify-content:center;">
        <div class="screen-bg" style="filter:grayscale(1) blur(10px);"></div>
        <h1>Игра окончена</h1>
        <p id="final-score" style="font-size:32px; font-weight:bold; margin-bottom:10px;"></p>
        <button class="btn" id="restart-btn">ЗАНОВО</button>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
const ASSETS = 'IMG/';
const TYPES = {
    ORG: { id: 'organic', name: 'Органика', img: 'bin_organic.png', imgSm: 'bin_organic_sm.png', pref: 'trash_apple' },
    PAP: { id: 'paper', name: 'Бумага', img: 'bin_paper.png', imgSm: 'bin_paper_sm.png', pref: 'trash_newspaper' },
    PLA: { id: 'plastic', name: 'Пластик', img: 'bin_plastic.png', imgSm: 'bin_plastic_sm.png', pref: 'trash_bottle' },
    MET: { id: 'metal', name: 'Металл', img: 'bin_met.png', imgSm: 'bin_met_sm.png', pref: 'trash_can' },
    GLA: { id: 'glass', name: 'Стекло', img: 'bin_glass.png', imgSm: 'bin_glass_sm.png', pref: 'trash_jar' }
};

// --- МГНОВЕННАЯ ИНИЦИАЛИЗАЦИЯ ЗАСТАВКИ ---
(function initStartScreen() {
    const isL = window.innerWidth > window.innerHeight;
    const container = document.getElementById('tutorial-bins');
    const labels = container.querySelectorAll('.bin-l');
    
    // Показываем/скрываем подписи на старте в зависимости от ориентации
    labels.forEach(l => l.style.display = isL ? 'none' : 'block');

    container.querySelectorAll('.tut-img').forEach(img => {
        const typeKey = img.getAttribute('data-id');
        const type = TYPES[typeKey];
        if(type) {
            // Сразу ставим правильную картинку
            img.src = ASSETS + (isL ? type.imgSm : type.img);
        }
    });
})();
// -----------------------------------------

const AudioSys = {
    ctx: null, mute: false,
    init() { if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
    play(f, t, d) {
        if(!this.ctx || this.mute) return;
        try {
            let o = this.ctx.createOscillator(), g = this.ctx.createGain();
            o.type = t; o.frequency.value = f;
            g.gain.setValueAtTime(0.08, this.ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + d);
            o.connect(g); g.connect(this.ctx.destination);
            o.start(); o.stop(this.ctx.currentTime + d);
        } catch(e) {}
    },
    ok() { this.play(600, 'sine', 0.2); },
    err() { this.play(150, 'sawtooth', 0.3); },
    pop() { this.play(800, 'triangle', 0.05); }
};

const Loader = {
    imgs: {},
    async load() {
        const list = { 'bg': 'bg_forest.png', 'leaf': 'leaf.png' };
        for(let i=1; i<=10; i++) list['a'+i] = 'animal'+i+'.png';
        Object.keys(TYPES).forEach(k => {
            list['b_'+TYPES[k].id] = TYPES[k].img;
            list['b_sm_'+TYPES[k].id] = TYPES[k].imgSm;
            for(let i=1; i<=5; i++) list[TYPES[k].pref+i] = TYPES[k].pref+i+'.png';
        });
        for(let k in list) {
            let img = new Image(); img.src = ASSETS + list[k];
            await new Promise(r => { img.onload = r; img.onerror = r; });
            this.imgs[k] = img;
        }
    }
};

const canvas = document.getElementById('gameCanvas'), ctx = canvas.getContext('2d');
let W, H, gameState = { running: false, paused: false, particles: [] };
const DEADLINE_Y_RATIO = 0.70; 

class Fragment {
    constructor(x, y) {
        this.x = x; this.y = y;
        this.vx = (Math.random() - 0.5) * 14;
        this.vy = (Math.random() - 0.5) * 14;
        this.life = 1.0;
        this.size = Math.random() * 8 + 4;
        this.color = Math.random() > 0.5 ? '#9e9e9e' : '#616161';
    }
    update() { this.x += this.vx; this.y += this.vy; this.life -= 0.04; }
    draw() { ctx.globalAlpha = this.life; ctx.fillStyle = this.color; ctx.fillRect(this.x, this.y, this.size, this.size); ctx.globalAlpha = 1; }
}

class Bin {
    constructor(cfg, i, total) { this.cfg = cfg; this.scale = 1; this.i = i; this.total = total; }
    
    // ЛОГИКА ЕДИНОГО РАЗМЕРА
    static updateAll(bins) {
        let winW = window.innerWidth, winH = window.innerHeight;
        let isL = winW > winH;
        let maxH = winH * (isL ? 0.25 : 0.45); // Максимально разрешенная высота
        let gap = winW / bins.length;
        let allowedW = gap * 0.98; // Максимально разрешенная ширина (чтобы не слиплись)

        // 1. Вычисляем общий масштаб, чтобы ВСЕ баки влезли
        let commonScale = 10000; // Начинаем с большого числа

        bins.forEach(b => {
            const imgKey = isL ? 'b_sm_' + b.cfg.id : 'b_' + b.cfg.id;
            const img = Loader.imgs[imgKey];
            if (img) {
                // Масштаб по высоте
                let sH = maxH / img.height;
                // Масштаб по ширине
                let sW = allowedW / img.width;
                // Берем наименьший, чтобы бак влез целиком
                let localMin = Math.min(sH, sW);
                
                // Ищем "слабое звено" среди всех баков
                if (localMin < commonScale) commonScale = localMin;
            }
        });

        // 2. Применяем общий масштаб ко всем
        bins.forEach(b => {
            const imgKey = isL ? 'b_sm_' + b.cfg.id : 'b_' + b.cfg.id;
            const img = Loader.imgs[imgKey];
            if (img) {
                b.w = img.width * commonScale;
                b.h = img.height * commonScale;
            } else {
                b.w = allowedW; b.h = maxH; // Фолбэк
            }
            b.x = b.i * gap + (gap - b.w) / 2;
            b.y = winH - b.h - (isL ? 15 : 45);
        });
    }

    draw() {
        let isL = window.innerWidth > window.innerHeight;
        let imgKey = isL ? 'b_sm_' + this.cfg.id : 'b_' + this.cfg.id;
        let img = Loader.imgs[imgKey]; if(!img) return;
        
        let sw = this.w * this.scale, sh = this.h * this.scale;
        
        if (!isL) {
            ctx.fillStyle = "black"; ctx.font = "bold 14px 'Segoe UI', Roboto, sans-serif"; ctx.textAlign = "center";
            let labelY = this.y + this.h + 20; 
            let textW = ctx.measureText(this.cfg.name).width + 12;
            ctx.fillRect(this.x + this.w/2 - textW/2, labelY - 15, textW, 20);
            ctx.fillStyle = "white"; ctx.fillText(this.cfg.name, this.x + this.w/2, labelY);
        }
        
        ctx.drawImage(img, this.x - (sw-this.w)/2, this.y - (sh-this.h)/2, sw, sh);
        if(this.scale > 1) this.scale -= 0.05;
    }
}

class Trash {
    constructor() {
        let ks = Object.keys(TYPES); this.cfg = TYPES[ks[Math.floor(Math.random()*ks.length)]];
        this.skin = Math.floor(Math.random()*5)+1; this.p = 0; this.lane = (Math.random()-0.5)*1.6;
        this.fly = false; this.t = 0; this.vs = 1;
    }
    update(dt) {
        if(gameState.paused) return;
        if(this.fly) { 
            this.t += 0.08; if(this.t > 0.7) this.vs = Math.max(0, 1 - (this.t - 0.7) * 3.3);
            if(this.t >= 1) this.resolve(); 
        } else { 
            this.p += 0.0022 * (gameState.speedMultiplier || 1) * (dt/16); 
            
            let winH = window.innerHeight;
            let sz = (Math.min(window.innerWidth, winH) * 0.35) * (0.18 + this.p * 0.82);
            let currentY = (winH * 0.44) + (winH - winH * 0.44) * this.p;
            let lineY = (winH * 0.44) + (winH - winH * 0.44) * DEADLINE_Y_RATIO;
            
            if(currentY + sz/3 >= lineY) { this.die = 1; this.explode(); handleMiss(); }
        }
    }
    explode() {
        let winW = window.innerWidth, winH = window.innerHeight;
        let x = winW/2 + (this.lane * winW * 0.45 * this.p);
        let y = (winH * 0.44) + (winH - winH * 0.44) * this.p;
        for(let i=0; i<18; i++) gameState.particles.push(new Fragment(x, y));
    }
    resolve() {
        this.die = 1;
        if(this.target.cfg.id === this.cfg.id) {
            gameState.score += 10; AudioSys.ok(); gameState.count++; 
            if(gameState.count % 10 === 0) spawnAnimal();
            if(gameState.count % 20 === 0) { 
                gameState.speedLevel++; gameState.speedMultiplier += 0.2; 
                document.getElementById('speed-text').innerText = gameState.speedLevel;
            }
        } else { 
            gameState.score = Math.max(0, gameState.score - 5); 
            AudioSys.err(); this.explode(); 
        }
        document.getElementById('stat-text').innerText = gameState.score;
    }
    draw() {
        let winW = window.innerWidth, winH = window.innerHeight;
        let sz = Math.min(winW, winH) * 0.35, x, y, s;
        if(this.fly) {
            let tx = this.target.x + this.target.w/2, ty = this.target.y + this.target.h/2;
            x = this.sx + (tx-this.sx)*this.t; y = this.sy + (ty-this.sy)*this.t - Math.sin(this.t*Math.PI)*160;
            s = sz * 0.8 * this.vs;
        } else {
            x = winW/2 + (this.lane * winW * 0.45 * this.p); y = winH*0.44 + (winH - winH * 0.44)*this.p;
            s = sz * (0.18 + this.p*0.82);
        }
        let img = Loader.imgs[this.cfg.pref+this.skin];
        if(img && this.vs > 0) ctx.drawImage(img, x-s/2, y-s/2, s, s);
    }
}

function handleMiss() { gameState.lives--; AudioSys.err(); updateHUD(); if(gameState.lives <= 0) endGame(); }

function updateHUD() {
    let c = document.getElementById('lives-container'); c.innerHTML = '';
    let leaf = Loader.imgs['leaf'];
    if(leaf) for(let i=0; i<gameState.lives; i++) c.innerHTML += `<img src="${leaf.src}" class="life-leaf">`;
}

function spawnAnimal() {
    const side = Math.random() > 0.5 ? 1 : -1;
    gameState.animal = { 
        img: Loader.imgs['a'+(Math.floor(Math.random()*10)+1)], 
        x: window.innerWidth/2 + (side * window.innerWidth * 0.35), 
        y: window.innerHeight * 0.3, life: 2.5, s: 0 
    };
}

function input(ex, ey) {
    if(!gameState.running || gameState.paused) return;
    let b = gameState.bins.find(b => ex > b.x && ex < b.x+b.w && ey > b.y - 60);
    if(b) {
        let t = gameState.trash.filter(t => !t.fly && t.p > 0.05).sort((a,b)=>b.p-a.p)[0];
        if(t) { 
            AudioSys.pop(); b.scale = 1.35; t.fly = true; t.target = b; 
            t.sx = window.innerWidth/2 + (t.lane * window.innerWidth * 0.45 * t.p); 
            t.sy = window.innerHeight*0.44 + (window.innerHeight - window.innerHeight*0.44)*t.p; 
        }
    }
}

function loop(time) {
    let dt = time - (gameState.lt || time); gameState.lt = time;
    ctx.clearRect(0,0,window.innerWidth,window.innerHeight);
    let bg = Loader.imgs['bg']; 
    if(bg) { 
        let winW = window.innerWidth, winH = window.innerHeight;
        let sc = Math.max(winW/bg.width, winH/bg.height); 
        ctx.drawImage(bg, (winW-bg.width*sc)/2, (winH-bg.height*sc)/2, bg.width*sc, bg.height*sc); 
    }
    
    if(gameState.running && !gameState.paused) {
        ctx.beginPath(); ctx.setLineDash([10, 10]); ctx.strokeStyle = "rgba(255, 0, 0, 0.6)"; ctx.lineWidth = 3;
        let lineY = window.innerHeight*0.44 + (window.innerHeight - window.innerHeight*0.44)*DEADLINE_Y_RATIO; 
        ctx.moveTo(0, lineY); ctx.lineTo(window.innerWidth, lineY); ctx.stroke(); ctx.setLineDash([]);

        gameState.st += dt; if(gameState.st > 2200/(gameState.speedMultiplier||1)) { gameState.trash.push(new Trash()); gameState.st=0; }
        
        gameState.trash.forEach(t => { t.update(dt); t.draw(); });
        gameState.trash = gameState.trash.filter(t => !t.die);
        gameState.particles.forEach(p => { p.update(); p.draw(); });
        gameState.particles = gameState.particles.filter(p => p.life > 0);
        gameState.bins.forEach(b => b.draw());
        if(gameState.animal) {
            let a = gameState.animal; a.life -= dt/1000; if(a.s < 1) a.s += 0.08;
            let sz = Math.min(window.innerWidth,window.innerHeight) * 0.25 * a.s; 
            if(a.img) ctx.drawImage(a.img, a.x-sz/2, a.y-sz/2, sz, sz);
            if(a.life <= 0) gameState.animal = null;
        }
    } else if(!gameState.running) {
        gameState.bins.forEach(b => b.draw());
    }
    requestAnimationFrame(loop);
}

document.getElementById('mute-btn').onclick = () => { AudioSys.mute = !AudioSys.mute; document.getElementById('mute-btn').innerText = AudioSys.mute ? "🔇" : "🔊"; };
document.getElementById('pause-btn-hud').onclick = () => { gameState.paused = !gameState.paused; document.getElementById('pause-btn-hud').innerText = gameState.paused ? "ИГРАТЬ" : "ПАУЗА"; };

function startGame() {
    AudioSys.init();
    gameState = { running: true, paused: false, score: 0, lives: 5, count: 0, speedMultiplier: 1, speedLevel: 1, trash: [], particles: [], st: 1500, lt: performance.now() };
    document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
    updateHUD();
}

function endGame() { 
    gameState.running = false; 
    document.getElementById('game-over-screen').classList.remove('hidden'); 
    document.getElementById('final-score').innerText = gameState.score;
}

function resize() {
    W = window.innerWidth; H = window.innerHeight; 
    const dpr = window.devicePixelRatio || 1;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.scale(dpr, dpr);
    
    let ks = Object.keys(TYPES); 
    gameState.bins = ks.map((k, i) => new Bin(TYPES[k], i, ks.length));
    
    // ВАЖНО: Выравниваем баки под одну гребенку
    Bin.updateAll(gameState.bins);
    
    // Обновляем HTML заставку (для переворота экрана)
    const container = document.getElementById('tutorial-bins'); 
    if(container) { 
        const isL = W > H; 
        const labels = container.querySelectorAll('.bin-l');
        labels.forEach(l => l.style.display = isL ? 'none' : 'block');
        
        container.querySelectorAll('.tut-img').forEach((img, i) => {
            const key = Object.keys(TYPES)[i];
            const t = TYPES[key];
            img.src = ASSETS + (isL ? t.imgSm : t.img);
        });
    }
}

window.addEventListener('resize', resize);
canvas.addEventListener('mousedown', e => input(e.clientX, e.clientY));
canvas.addEventListener('touchstart', e => { e.preventDefault(); input(e.touches[0].clientX, e.touches[0].clientY); }, {passive: false});
document.getElementById('start-btn').onclick = startGame;
document.getElementById('restart-btn').onclick = startGame;

Loader.load().then(() => { resize(); requestAnimationFrame(loop); });
</script>
</body>
</html>
