<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Эко-Тропа</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #2E7D32; font-family: sans-serif; }
        canvas { display: block; touch-action: none; }
        
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; pointer-events: none; z-index: 10; }
        .hud { pointer-events: auto; background: rgba(0,0,0,0.5); color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(5px); }
        
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; color: white; text-align: center; }
        .screen-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: url('IMG/bg_forest.png') no-repeat center center; background-size: cover; filter: blur(8px); z-index: -1; }
        
        .btn { pointer-events: auto; background: #4CAF50; border: none; padding: 15px 50px; color: white; font-size: 24px; font-weight: bold; border-radius: 15px; cursor: pointer; box-shadow: 0 6px 0 #1B5E20; }
        .btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #1B5E20; }
        
        #lives-container { display: flex; gap: 5px; }
        .life-leaf { width: 25px; height: 25px; object-fit: contain; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="hud">
            <div id="stat-text">Очки: 0</div>
            <div id="lives-container"></div>
        </div>
    </div>

    <div id="start-screen" class="screen">
        <div class="screen-bg"></div>
        <h1>Эко-Тропа</h1>
        <p>Жми на правильный бак!</p>
        <button class="btn" id="start-btn">В ПУТЬ</button>
    </div>

    <div id="game-over-screen" class="screen hidden">
        <div class="screen-bg" style="filter: grayscale(1) blur(10px);"></div>
        <h1>Игра окончена</h1>
        <p id="final-score" style="font-size: 24px;"></p>
        <button class="btn" id="restart-btn">ЗАНОВО</button>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
const ASSETS = 'IMG/';
const TYPES = {
    ORG: { id: 'organic', img: 'bin_organic.png', pref: 'trash_apple' },
    PAP: { id: 'paper', img: 'bin_paper.png', pref: 'trash_newspaper' },
    PLA: { id: 'plastic', img: 'bin_plastic.png', pref: 'trash_bottle' },
    MET: { id: 'metal', img: 'bin_met.png', pref: 'trash_can' },
    GLA: { id: 'glass', img: 'bin_glass.png', pref: 'trash_jar' }
};

const AudioSys = {
    ctx: null,
    init() { if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
    play(f, t, d) {
        if(!this.ctx) return;
        let o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = t; o.frequency.value = f; g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + d);
        o.connect(g); g.connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime + d);
    },
    ok() { this.play(600, 'sine', 0.2); },
    err() { this.play(150, 'sawtooth', 0.3); },
    pop() { this.play(800, 'triangle', 0.05); }
};

const Loader = {
    imgs: {},
    async load() {
        const list = { 'bg': 'bg_forest.png', 'leaf': 'leaf.png' };
        for(let i=1; i<=10; i++) list['a'+i] = 'animal'+i+'.png';
        Object.keys(TYPES).forEach(k => {
            list['b_'+TYPES[k].id] = TYPES[k].img;
            for(let i=1; i<=5; i++) list[TYPES[k].pref+i] = TYPES[k].pref+i+'.png';
        });
        for(let k in list) {
            let img = new Image(); img.src = ASSETS + list[k];
            await new Promise(r => img.onload = r); this.imgs[k] = img;
        }
    }
};

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let W, H, gameState = { running: false };

class Bin {
    constructor(cfg, i, total) {
        this.cfg = cfg; this.scale = 1;
        this.w = 0; this.h = 0; this.x = 0; this.y = 0;
        this.resize(i, total);
    }
    resize(i, total) {
        let gap = W / total;
        this.w = Math.min(gap * 0.95, W < 600 ? 80 : 150);
        this.h = this.w * 1.3;
        this.x = i * gap + (gap - this.w)/2;
        this.y = H - this.h * 0.85;
    }
    draw() {
        let img = Loader.imgs['b_'+this.cfg.id], sw = this.w * this.scale, sh = this.h * this.scale;
        ctx.drawImage(img, this.x - (sw-this.w)/2, this.y - (sh-this.h)/2, sw, sh);
        if(this.scale > 1) this.scale -= 0.05;
    }
}

class Trash {
    constructor() {
        let keys = Object.keys(TYPES);
        this.cfg = TYPES[keys[Math.floor(Math.random()*keys.length)]];
        this.skin = Math.floor(Math.random()*5)+1;
        this.p = 0; this.lane = (Math.random()-0.5)*1.8;
        this.fly = false; this.t = 0;
    }
    update(dt) {
        if(this.fly) { this.t += 0.08; if(this.t >= 1) this.resolve(); }
        else { this.p += 0.002 * (gameState.speed || 1) * (dt/16); if(this.p > 1.1) { this.die=1; handleMiss(); } }
    }
    resolve() {
        this.die = 1;
        if(this.target.cfg.id === this.cfg.id) {
            gameState.score += 10; AudioSys.ok();
            gameState.count++; if(gameState.count%10===0) spawnAnimal();
            if(gameState.count%20===0) gameState.speed += 0.2;
        } else { handleMiss(); }
        document.getElementById('stat-text').innerText = "Очки: " + gameState.score;
    }
    draw() {
        let x, y, s, sz = Math.min(W, H) * 0.3;
        if(this.fly) {
            let tx = this.target.x + this.target.w/2, ty = this.target.y + this.target.h/2;
            x = this.sx + (tx-this.sx)*this.t; y = this.sy + (ty-this.sy)*this.t - Math.sin(this.t*Math.PI)*150;
            s = sz * 0.8;
        } else {
            x = W/2 + (this.lane * W * 0.4 * this.p); y = H*0.44 + (H-H*0.44)*this.p;
            s = sz * (0.2 + this.p*0.8);
        }
        ctx.drawImage(Loader.imgs[this.cfg.pref+this.skin], x-s/2, y-s/2, s, s);
    }
}

function spawnAnimal() {
    gameState.animal = { img: Loader.imgs['a'+(Math.floor(Math.random()*10)+1)], x: W*(0.2+Math.random()*0.6), y: H*0.5, life: 2, s: 0 };
}

function handleMiss() { gameState.lives--; AudioSys.err(); updateHUD(); if(gameState.lives<=0) endGame(); }

function updateHUD() {
    let c = document.getElementById('lives-container'); c.innerHTML = '';
    for(let i=0; i<gameState.lives; i++) c.innerHTML += `<img src="${ASSETS}leaf.png" class="life-leaf">`;
}

function input(ex, ey) {
    if(!gameState.running) return;
    let b = gameState.bins.find(b => ex > b.x && ex < b.x+b.w && ey > b.y);
    if(b) {
        let t = gameState.trash.filter(t => !t.fly && t.p > 0.1).sort((a,b)=>b.p-a.p)[0];
        if(t) { 
            AudioSys.pop(); b.scale = 1.3; t.fly = true; t.target = b;
            t.sx = W/2 + (t.lane * W * 0.4 * t.p); t.sy = H*0.44 + (H-H*0.44)*t.p;
        }
    }
}

function loop(time) {
    if(!gameState.running) return;
    let dt = time - (gameState.lt || time); gameState.lt = time;
    ctx.clearRect(0,0,W,H);
    
    let bg = Loader.imgs['bg'], sc = Math.max(W/bg.width, H/bg.height);
    ctx.drawImage(bg, (W-bg.width*sc)/2, (H-bg.height*sc)/2, bg.width*sc, bg.height*sc);

    gameState.st += dt; if(gameState.st > 2000/(gameState.speed||1)) { gameState.trash.push(new Trash()); gameState.st=0; }
    
    gameState.trash.forEach(t => { t.update(dt); t.draw(); });
    gameState.trash = gameState.trash.filter(t => !t.die);
    gameState.bins.forEach(b => b.draw());

    if(gameState.animal) {
        let a = gameState.animal; a.life -= dt/1000; if(a.s<1) a.s+=0.1;
        let sz = Math.min(W,H)*0.4*a.s; ctx.drawImage(a.img, a.x-sz/2, a.y-sz/2, sz, sz);
        if(a.life<=0) gameState.animal = null;
    }
    requestAnimationFrame(loop);
}

function startGame() {
    AudioSys.init();
    gameState = { running: true, score: 0, lives: 5, count: 0, speed: 1, trash: [], st: 2000, lt: performance.now() };
    document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
    resize(); updateHUD(); requestAnimationFrame(loop);
}

function endGame() {
    gameState.running = false;
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('final-score').innerText = "Ваш результат: " + gameState.score;
}

function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W; canvas.height = H;
    let ks = Object.keys(TYPES);
    gameState.bins = ks.map((k, i) => new Bin(TYPES[k], i, ks.length));
}

window.addEventListener('resize', resize);
canvas.addEventListener('mousedown', e => input(e.clientX, e.clientY));
canvas.addEventListener('touchstart', e => { e.preventDefault(); input(e.touches[0].clientX, e.touches[0].clientY); }, {passive: false});
document.getElementById('start-btn').onclick = startGame;
document.getElementById('restart-btn').onclick = startGame;
Loader.load().then(resize);
</script>
</body>
</html>
