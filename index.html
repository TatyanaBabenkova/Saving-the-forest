<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Эко-Тропа: Сортировка</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #333;
            touch-action: none; /* Отключаем зум и скролл на тачах */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .hud {
            padding: 15px;
            color: white;
            text-shadow: 2px 2px 2px black;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }
        #start-screen, #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 10;
            pointer-events: auto;
        }
        .btn {
            background: #4CAF50;
            border: none;
            padding: 15px 40px;
            color: white;
            font-size: 24px;
            cursor: pointer;
            border-radius: 10px;
            margin-top: 20px;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.95); }
        h1 { font-size: 48px; margin-bottom: 10px; text-align: center; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="hud">
            <span id="score-el">Очки: 0</span>
            <span id="lives-el">Жизни: 5</span>
        </div>
    </div>

    <div id="start-screen">
        <h1>Эко-Тропа</h1>
        <p>Сортируй мусор, спасай лес!</p>
        <button class="btn" id="start-btn">Начать путь</button>
    </div>

    <div id="game-over-screen" class="hidden">
        <h1>Игра окончена</h1>
        <p id="final-score">Твой счет: 0</p>
        <button class="btn" id="restart-btn">Попробовать снова</button>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
/**
 * КОНФИГУРАЦИЯ И РЕСУРСЫ
 */
const ASSETS_PATH = 'img/';
const TYPES = {
    ORGANIC: { id: 'organic', color: '#8BC34A', binImg: 'bin_organic.png', prefix: 'trash_apple' },
    PAPER:   { id: 'paper',   color: '#2196F3', binImg: 'bin_paper.png',   prefix: 'trash_newspaper' },
    PLASTIC: { id: 'plastic', color: '#FF9800', binImg: 'bin_plastic.png', prefix: 'trash_bottle' },
    METAL:   { id: 'metal',   color: '#9E9E9E', binImg: 'bin_met.png',     prefix: 'trash_can' },
    GLASS:   { id: 'glass',   color: '#00BCD4', binImg: 'bin_glass.png',   prefix: 'trash_jar' }
};

const DECOR_TYPES = [
    { prefix: 'tree', count: 5 },
    { prefix: 'bush', count: 5 },
    { prefix: 'flower', count: 5 }
];

/**
 * АУДИО СИСТЕМА (Web Audio API)
 * Генерирует звуки без внешних файлов
 */
const AudioSys = {
    ctx: null,
    init() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    },
    playTone(freq, type, duration) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
    },
    playSuccess() { this.playTone(600, 'sine', 0.2); setTimeout(() => this.playTone(900, 'sine', 0.4), 100); },
    playError() { this.playTone(150, 'sawtooth', 0.4); },
    playPop() { this.playTone(400, 'triangle', 0.1); }
};

/**
 * МЕНЕДЖЕР РЕСУРСОВ
 * Загружает картинки и создает заглушки при ошибках
 */
const Loader = {
    images: {},
    loadImg(key, src) {
        return new Promise((resolve) => {
            const img = new Image();
            img.src = src;
            img.onload = () => {
                this.images[key] = { img: img, loaded: true };
                resolve();
            };
            img.onerror = () => {
                // Если картинки нет, помечаем как false, будем рисовать заглушку
                this.images[key] = { img: null, loaded: false };
                resolve();
            };
        });
    },
    async init() {
        const promises = [];
        // Фон
        promises.push(this.loadImg('bg', ASSETS_PATH + 'bg_forest.png')); // Попробуй .jpg если png нет
        
        // Баки
        for (let key in TYPES) {
            promises.push(this.loadImg(`bin_${TYPES[key].id}`, ASSETS_PATH + TYPES[key].binImg));
        }
        
        // Мусор (1-5)
        for (let key in TYPES) {
            for (let i = 1; i <= 5; i++) {
                promises.push(this.loadImg(`${TYPES[key].prefix}${i}`, `${ASSETS_PATH}${TYPES[key].prefix}${i}.png`));
            }
        }

        // Декор (1-5)
        DECOR_TYPES.forEach(d => {
            for (let i = 1; i <= 5; i++) {
                promises.push(this.loadImg(`${d.prefix}${i}`, `${ASSETS_PATH}${d.prefix}${i}.png`));
            }
        });

        await Promise.all(promises);
    },
    get(key) { return this.images[key]; }
};

/**
 * ИГРОВАЯ ЛОГИКА
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let width, height, cx, cy;

// Состояние игры
let gameState = {
    score: 0,
    lives: 5,
    speed: 1, // Множитель скорости
    isRunning: false,
    bins: [],
    trash: [],
    decor: [],
    particles: [],
    lastTime: 0,
    spawnTimer: 0,
    decorTimer: 0
};

// --- Классы ---

class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 10;
        this.vy = (Math.random() - 0.5) * 10;
        this.life = 1.0;
        this.color = color;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= 0.05;
    }
    draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }
}

class Bin {
    constructor(typeObj, index, total) {
        this.type = typeObj;
        // Распределяем баки по ширине
        const margin = 20;
        const availableW = width - (margin * 2);
        const binW = availableW / total;
        
        this.w = Math.min(80, binW - 10);
        this.h = this.w * 1.2;
        this.x = margin + (index * binW) + (binW / 2) - (this.w / 2);
        this.y = 20;
        this.scale = 1;
    }

    checkHit(x, y) {
        return x > this.x && x < this.x + this.w && y > this.y && y < this.y + this.h;
    }

    draw(ctx) {
        const res = Loader.get(`bin_${this.type.id}`);
        if (res && res.loaded) {
            ctx.drawImage(res.img, this.x, this.y, this.w, this.h);
        } else {
            // Заглушка
            ctx.fillStyle = this.type.color;
            ctx.fillRect(this.x, this.y, this.w, this.h);
            ctx.strokeStyle = 'white';
            ctx.strokeRect(this.x, this.y, this.w, this.h);
            ctx.fillStyle = 'white';
            ctx.font = '12px Arial';
            ctx.fillText(this.type.id.toUpperCase(), this.x + 5, this.y + 20);
        }
    }
}

// Базовый класс для 3D объектов
class Prop {
    constructor(isTrash = false) {
        // Все спавнится в центре (Vanishing point)
        this.x = cx;
        this.y = cy;
        this.z = 0.01; // Глубина (0 - далеко, 1 - близко)
        this.isTrash = isTrash;
        this.markedForDeletion = false;
        
        if (isTrash) {
            // Мусор летит строго вниз и чуть в стороны рандомно
            this.angle = Math.PI / 2 + (Math.random() - 0.5) * 0.5;
            this.speedZ = 0.005; 
        } else {
            // Декор разлетается во все стороны, кроме низа (где мусор)
            // Угол от PI (лево) до 2PI (право) через верх
            this.angle = Math.PI + (Math.random() * Math.PI);
            this.speedZ = 0.008; // Декор движется быстрее для эффекта скорости
        }
        
        // Вектор движения на плоскости экрана
        this.vx = Math.cos(this.angle) * width * 0.8; 
        this.vy = Math.sin(this.angle) * height * 0.8;
    }

    update(dt) {
        // Увеличиваем Z (приближение)
        this.z += this.speedZ * gameState.speed * (dt / 16);

        if (this.z >= 1 && !this.isTrash) this.markedForDeletion = true;
        // Мусор удаляем только если ушел за низ
        if (this.isTrash && (cy + this.vy * this.z) > height + 100) {
             this.markedForDeletion = true;
             handleMiss();
        }
    }

    getScreenPos() {
        return {
            x: cx + this.vx * this.z,
            y: cy + this.vy * this.z,
            scale: this.z
        };
    }
}

class Trash extends Prop {
    constructor() {
        super(true);
        // Выбираем тип
        const keys = Object.keys(TYPES);
        const randomKey = keys[Math.floor(Math.random() * keys.length)];
        this.type = TYPES[randomKey];
        // Выбираем скин 1-5
        this.skinId = Math.floor(Math.random() * 5) + 1;
        
        this.isDragging = false;
        this.dragX = 0;
        this.dragY = 0;
        this.radius = 40; // Размер хитбокса
    }

    update(dt) {
        if (!this.isDragging) {
            super.update(dt);
        }
    }

    draw(ctx) {
        const pos = this.getScreenPos();
        let drawX = this.isDragging ? this.dragX : pos.x;
        let drawY = this.isDragging ? this.dragY : pos.y;
        let scale = this.isDragging ? 1.2 : pos.scale; // При драге увеличиваем
        
        let size = 80 * scale;

        const imgKey = `${this.type.prefix}${this.skinId}`;
        const res = Loader.get(imgKey);

        ctx.save();
        ctx.translate(drawX, drawY);
        
        if (res && res.loaded) {
            ctx.drawImage(res.img, -size/2, -size/2, size, size);
        } else {
            // Заглушка
            ctx.fillStyle = this.type.color;
            ctx.beginPath();
            ctx.arc(0, 0, size/2, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = 'black';
            ctx.textAlign = 'center';
            ctx.font = `${Math.floor(14*scale)}px Arial`;
            ctx.fillText(this.type.id[0].toUpperCase(), 0, 5);
        }
        ctx.restore();
    }
}

class Decor extends Prop {
    constructor() {
        super(false);
        const types = DECOR_TYPES;
        const t = types[Math.floor(Math.random() * types.length)];
        this.skinId = Math.floor(Math.random() * 5) + 1;
        this.prefix = t.prefix;
    }

    draw(ctx) {
        const pos = this.getScreenPos();
        let size = 150 * pos.scale;
        
        const imgKey = `${this.prefix}${this.skinId}`;
        const res = Loader.get(imgKey);

        if (res && res.loaded) {
            ctx.drawImage(res.img, pos.x - size/2, pos.y - size/2, size, size);
        } else {
            // Для декора без картинок просто рисуем зеленые круги
            ctx.globalAlpha = pos.scale;
            ctx.fillStyle = '#2E7D32';
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, size/2, 0, Math.PI*2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }
    }
}

// --- Управление ---

let dragItem = null;

function handleInputStart(x, y) {
    if (!gameState.isRunning) return;
    
    // Ищем мусор, в который попали. Начинаем с самого "ближнего" (последний в массиве)
    for (let i = gameState.trash.length - 1; i >= 0; i--) {
        const t = gameState.trash[i];
        const pos = t.getScreenPos();
        const size = 80 * pos.scale;
        
        // Простая проверка дистанции
        const dx = x - pos.x;
        const dy = y - pos.y;
        if (Math.sqrt(dx*dx + dy*dy) < size/2) {
            dragItem = t;
            t.isDragging = true;
            t.dragX = x;
            t.dragY = y;
            AudioSys.playPop();
            break;
        }
    }
}

function handleInputMove(x, y) {
    if (dragItem) {
        dragItem.dragX = x;
        dragItem.dragY = y;
    }
}

function handleInputEnd(x, y) {
    if (dragItem) {
        // Проверяем попадание в бак
        let hitBin = null;
        for (let bin of gameState.bins) {
            if (bin.checkHit(x, y)) {
                hitBin = bin;
                break;
            }
        }

        if (hitBin) {
            if (hitBin.type.id === dragItem.type.id) {
                // ПРАВИЛЬНО
                gameState.score += 10;
                AudioSys.playSuccess();
                createParticles(x, y, hitBin.type.color);
            } else {
                // ОШИБКА
                gameState.score = Math.max(0, gameState.score - 5);
                AudioSys.playError();
                createParticles(x, y, '#555');
                triggerShake();
            }
            // Удаляем мусор
            dragItem.markedForDeletion = true;
        } else {
            // Отпустили мимо - возвращаем в поток
            dragItem.isDragging = false;
        }
        
        updateHUD();
        dragItem = null;
    }
}

// --- События ---

window.addEventListener('resize', resize);
canvas.addEventListener('mousedown', e => handleInputStart(e.clientX, e.clientY));
canvas.addEventListener('mousemove', e => handleInputMove(e.clientX, e.clientY));
canvas.addEventListener('mouseup', e => handleInputEnd(e.clientX, e.clientY));

canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    handleInputStart(e.touches[0].clientX, e.touches[0].clientY);
}, {passive: false});
canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    handleInputMove(e.touches[0].clientX, e.touches[0].clientY);
}, {passive: false});
canvas.addEventListener('touchend', e => {
    e.preventDefault();
    // Touchend не имеет clientX, берем из changedTouches
    handleInputEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
});

// Кнопки
document.getElementById('start-btn').onclick = startGame;
document.getElementById('restart-btn').onclick = startGame;

// --- Игровой Цикл ---

function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
    cx = width / 2;
    cy = height / 3; // Точка схода чуть выше центра (горизонт)
    
    // Пересчет позиций баков при ресайзе
    if (gameState.bins.length > 0) {
        gameState.bins = []; 
        createBins();
    }
}

function createBins() {
    let i = 0;
    const count = Object.keys(TYPES).length;
    for (let key in TYPES) {
        gameState.bins.push(new Bin(TYPES[key], i++, count));
    }
}

function createParticles(x, y, color) {
    for(let i=0; i<10; i++) {
        gameState.particles.push(new Particle(x, y, color));
    }
}

function handleMiss() {
    gameState.lives--;
    AudioSys.playError();
    triggerShake();
    updateHUD();
    if (gameState.lives <= 0) gameOver();
}

let shakeTimer = 0;
function triggerShake() { shakeTimer = 10; }

function updateHUD() {
    document.getElementById('score-el').textContent = `Очки: ${gameState.score}`;
    document.getElementById('lives-el').textContent = `Жизни: ${gameState.lives}`;
}

function gameOver() {
    gameState.isRunning = false;
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('final-score').textContent = `Итоговый счет: ${gameState.score}`;
}

function startGame() {
    AudioSys.init();
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('game-over-screen').classList.add('hidden');
    
    gameState = {
        score: 0,
        lives: 5,
        speed: 1,
        isRunning: true,
        bins: [],
        trash: [],
        decor: [],
        particles: [],
        lastTime: performance.now(),
        spawnTimer: 0,
        decorTimer: 0
    };
    
    createBins();
    updateHUD();
    resize();
    requestAnimationFrame(loop);
}

function loop(time) {
    if (!gameState.isRunning) return;

    const dt = time - gameState.lastTime;
    gameState.lastTime = time;

    // Очистка
    ctx.clearRect(0, 0, width, height);

    // Рисуем Фон
    const bgRes = Loader.get('bg');
    if (bgRes && bgRes.loaded) {
        // Растягиваем фон
        ctx.drawImage(bgRes.img, 0, 0, width, height);
    } else {
        // Градиент неба и травы если фона нет
        const grad = ctx.createLinearGradient(0, 0, 0, height);
        grad.addColorStop(0, '#87CEEB');
        grad.addColorStop(0.3, '#87CEEB');
        grad.addColorStop(0.3, '#4CAF50');
        grad.addColorStop(1, '#2E7D32');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);
    }

    // Тряска экрана
    if (shakeTimer > 0) {
        ctx.save();
        ctx.translate((Math.random()-0.5)*10, (Math.random()-0.5)*10);
        shakeTimer--;
    }

    // Логика спавна
    gameState.spawnTimer += dt;
    gameState.decorTimer += dt;
    
    // Усложнение
    gameState.speed = 1 + (gameState.score / 100);

    // Спавн мусора (зависит от скорости)
    if (gameState.spawnTimer > 2000 / gameState.speed) {
        gameState.trash.push(new Trash());
        gameState.spawnTimer = 0;
    }
    // Спавн декора (чаще)
    if (gameState.decorTimer > 500 / gameState.speed) {
        gameState.decor.push(new Decor());
        gameState.decorTimer = 0;
    }

    // Обновление и отрисовка декора (позади мусора)
    gameState.decor.forEach(d => d.update(dt));
    gameState.decor = gameState.decor.filter(d => !d.markedForDeletion);
    gameState.decor.sort((a,b) => a.z - b.z); // Сортировка по Z (Painter's algo)
    gameState.decor.forEach(d => d.draw(ctx));

    // Обновление и отрисовка мусора
    gameState.trash.forEach(t => t.update(dt));
    gameState.trash = gameState.trash.filter(t => !t.markedForDeletion);
    // Мусор тоже сортируем, но драг-элемент всегда сверху
    gameState.trash.sort((a,b) => {
        if (a.isDragging) return 1;
        if (b.isDragging) return -1;
        return a.z - b.z;
    });
    gameState.trash.forEach(t => t.draw(ctx));

    // Баки (Интерфейс)
    gameState.bins.forEach(b => b.draw(ctx));

    // Частицы
    gameState.particles.forEach(p => p.update());
    gameState.particles = gameState.particles.filter(p => p.life > 0);
    gameState.particles.forEach(p => p.draw(ctx));

    if (shakeTimer > 0) ctx.restore();

    requestAnimationFrame(loop);
}

// Запуск загрузки
Loader.init().then(() => {
    resize();
    console.log("Assets loaded");
});

</script>
</body>
</html>
