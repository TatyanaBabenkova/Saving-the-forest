<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Эко-Тропа: Реакция</title>
    <style>
        body {
            margin: 0; padding: 0; overflow: hidden;
            background-color: #2E7D32;
            touch-action: none;
            font-family: 'Segoe UI', sans-serif;
            height: 100dvh; width: 100vw;
        }
        canvas { display: block; width: 100%; height: 100%; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .hud-panel {
            pointer-events: auto; background: rgba(0, 0, 0, 0.6);
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 20px; color: white; backdrop-filter: blur(5px);
            border-radius: 0 0 15px 15px;
        }
        #pause-btn { background: #FF9800; border: 2px solid #fff; color: white; font-weight: bold; border-radius: 20px; cursor: pointer; padding: 5px 15px; }
        #lives-container { display: flex; align-items: center; gap: 2px; }
        .life-leaf { width: 30px; height: 30px; object-fit: contain; }
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; z-index: 100; pointer-events: auto; text-align: center; }
        .screen-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: url('IMG/bg_forest.png') no-repeat center center; background-size: cover; filter: blur(8px); z-index: -1; transform: scale(1.1); }
        .btn { background: #4CAF50; border: none; padding: 15px 45px; color: white; font-size: 24px; cursor: pointer; border-radius: 15px; box-shadow: 0 6px 0 #2E7D32; font-weight: bold; margin-top: 20px; }
        .btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #2E7D32; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="hud-panel">
            <div style="font-size: 18px;">Очки: <span id="score-el">0</span> | Скор: <span id="speed-el">1</span></div>
            <button id="pause-btn">ПАУЗА</button>
            <div id="lives-container"></div>
        </div>
    </div>

    <div id="start-screen" class="screen">
        <div class="screen-bg"></div>
        <h1>Эко-Тропа</h1>
        <p>Тапай на нужный бак!</p>
        <button class="btn" id="start-btn">В ПУТЬ</button>
    </div>

    <div id="game-over-screen" class="screen hidden">
        <div class="screen-bg" style="filter: grayscale(1) blur(5px);"></div>
        <h1>Конец игры</h1>
        <p id="final-score" style="font-size: 28px;">Счет: 0</p>
        <button class="btn" id="restart-btn">ЗАНОВО</button>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
const ASSETS_PATH = 'IMG/';
const HORIZON_Y = 0.44; 

const TYPES = {
    ORGANIC: { id: 'organic', color: '#8BC34A', binImg: 'bin_organic.png', prefix: 'trash_apple' },
    PAPER:   { id: 'paper',   color: '#2196F3', binImg: 'bin_paper.png',   prefix: 'trash_newspaper' },
    PLASTIC: { id: 'plastic', color: '#FF9800', binImg: 'bin_plastic.png', prefix: 'trash_bottle' },
    METAL:   { id: 'metal',   color: '#9E9E9E', binImg: 'bin_met.png',     prefix: 'trash_can' },
    GLASS:   { id: 'glass',   color: '#00BCD4', binImg: 'bin_glass.png',   prefix: 'trash_jar' }
};

// --- ЗВУКОВАЯ СИСТЕМА ИЗ ПРЕДЫДУЩЕГО КОДА ---
const AudioSys = {
    ctx: null,
    init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
    playTone(freq, type, duration, vol=0.1) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + duration);
    },
    playSuccess() { this.playTone(500, 'sine', 0.1); setTimeout(() => this.playTone(1000, 'sine', 0.2), 100); },
    playError() { this.playTone(150, 'sawtooth', 0.3, 0.2); },
    playPop() { this.playTone(600, 'triangle', 0.05, 0.05); }
};

const Loader = {
    images: {},
    async init() {
        const toLoad = { 'bg': 'bg_forest.png', 'leaf': 'leaf.png' };
        for (let i=1; i<=10; i++) toLoad[`animal${i}`] = `animal${i}.png`;
        for (let k in TYPES) {
            toLoad[`bin_${TYPES[k].id}`] = TYPES[k].binImg;
            for (let i=1; i<=5; i++) toLoad[`${TYPES[k].prefix}${i}`] = `${TYPES[k].prefix}${i}.png`;
        }
        for (let key in toLoad) {
            const img = new Image();
            img.src = ASSETS_PATH + toLoad[key];
            await new Promise(r => img.onload = r);
            this.images[key] = img;
        }
    },
    get(key) { return this.images[key]; }
};

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let width, height, cx, cy;
let isHandlingClick = false; 

let gameState = {
    score: 0, lives: 5, itemsSorted: 0, speedLevel: 1, speedMult: 1,
    isRunning: false, bins: [], trash: [], activeAnimal: null,
    spawnTimer: 0, lastTime: 0, lastLaunchTime: 0
};

class Bin {
    constructor(typeObj, index, total) {
        this.type = typeObj;
        this.scale = 1.0;
        this.recalculate(index, total);
    }
    recalculate(index, total) {
        const isPortrait = height > width;
        if (isPortrait) {
            // ВЕРТИКАЛЬНО: 2 ряда для максимальной ширины
            const itemsPerRow = index < 3 ? 3 : 2;
            const rowIdx = index < 3 ? 0 : 1;
            const posInRow = index < 3 ? index : index - 3;
            const gap = width / itemsPerRow;
            this.w = gap * 0.9;
            this.h = this.w * 1.2;
            this.x = (posInRow * gap) + (gap / 2) - (this.w / 2);
            this.y = height - (this.h * (rowIdx === 0 ? 1.6 : 0.75));
        } else {
            // ГОРИЗОНТАЛЬНО: в один ряд
            const gap = width / total;
            this.w = Math.min(gap * 0.9, 160);
            this.h = this.w * 1.3;
            this.x = (index * gap) + (gap / 2) - (this.w / 2);
            this.y = height - (this.h * 0.8);
        }
    }
    draw(ctx) {
        const img = Loader.get(`bin_${this.type.id}`);
        const dw = this.w * this.scale;
        const dh = this.h * this.scale;
        ctx.drawImage(img, this.x - (dw-this.w)/2, this.y - (dh-this.h)/2, dw, dh);
        if (this.scale > 1.0) this.scale -= 0.05;
    }
}

class Trash {
    constructor() {
        const keys = Object.keys(TYPES);
        this.type = TYPES[keys[Math.floor(Math.random() * keys.length)]];
        this.skin = Math.floor(Math.random() * 5) + 1;
        this.progress = 0;
        this.lane = (Math.random() - 0.5) * 1.8;
        this.flying = false; this.flyT = 0;
    }
    update(dt) {
        if (this.flying) {
            this.flyT += 0.08;
            if (this.flyT >= 1) this.resolve();
            return;
        }
        // Возвращена спокойная скорость из старого кода
        this.progress += 0.002 * gameState.speedMult * (dt / 16);
        if (this.progress > 1.05) { this.remove = true; handleMiss(); }
    }
    resolve() {
        this.remove = true;
        if (this.targetBin.type.id === this.type.id) {
            gameState.score += 10;
            gameState.itemsSorted++;
            AudioSys.playSuccess();
            if (gameState.itemsSorted % 10 === 0) spawnAnimal();
            if (gameState.itemsSorted % 20 === 0) { // Каждые 20 ускоряемся
                gameState.speedLevel++;
                gameState.speedMult += 0.2;
                document.getElementById('speed-el').innerText = gameState.speedLevel;
            }
        } else {
            gameState.score = Math.max(0, gameState.score - 5);
            handleMiss();
        }
        document.getElementById('score-el').innerText = gameState.score;
    }
    draw(ctx) {
        let x, y, s;
        const sizeBase = Math.min(width, height) * 0.3;
        if (this.flying) {
            const tx = this.targetBin.x + this.targetBin.w/2, ty = this.targetBin.y + this.targetBin.h/2;
            x = this.sx + (tx - this.sx) * this.flyT;
            y = this.sy + (ty - this.sy) * this.flyT - Math.sin(this.flyT * Math.PI) * 150;
            s = sizeBase;
        } else {
            x = cx + (this.lane * (width * 0.45) * this.progress);
            y = cy + (height - cy) * this.progress;
            s = sizeBase * (0.15 + this.progress * 0.85);
        }
        const img = Loader.get(`${this.type.prefix}${this.skin}`);
        if (img) ctx.drawImage(img, x - s/2, y - s/2, s, s);
    }
}

function onClick(e) {
    if (!gameState.isRunning || isHandlingClick) return;
    
    // Предотвращение двойного срабатывания (touch + click)
    isHandlingClick = true;
    setTimeout(() => isHandlingClick = false, 50);

    const touch = e.clientX ? e : e.touches[0];
    const bin = gameState.bins.find(b => 
        touch.clientX > b.x && touch.clientX < b.x + b.w && touch.clientY > b.y
    );

    if (bin) {
        const now = Date.now();
        if (now - gameState.lastLaunchTime < 150) return; // Мини задержка запуска

        bin.scale = 1.3;
        const target = gameState.trash.filter(t => !t.flying && t.progress > 0.05)
                                     .sort((a,b) => b.progress - a.progress)[0];
        if (target) {
            AudioSys.playPop();
            target.flying = true;
            target.targetBin = bin;
            target.sx = cx + (target.lane * (width * 0.45) * target.progress);
            target.sy = cy + (height - cy) * target.progress;
            gameState.lastLaunchTime = now;
        }
    }
}

function spawnAnimal() {
    const id = Math.floor(Math.random() * 10) + 1;
    gameState.activeAnimal = { img: Loader.get(`animal${id}`), x: width*(0.2+Math.random()*0.6), y: height*0.5, life: 2, scale: 0 };
}

function handleMiss() { gameState.lives--; AudioSys.playError(); updateHUD(); if (gameState.lives <= 0) endGame(); }

function updateHUD() {
    const container = document.getElementById('lives-container');
    container.innerHTML = '';
    for (let i=0; i<gameState.lives; i++) {
        const img = document.createElement('img');
        img.src = Loader.get('leaf').src;
        img.className = 'life-leaf';
        container.appendChild(img);
    }
}

function loop(time) {
    if (!gameState.isRunning) return;
    const dt = time - gameState.lastTime; gameState.lastTime = time;
    ctx.clearRect(0, 0, width, height);
    
    const bg = Loader.get('bg');
    if (bg) {
        const scale = Math.max(width/bg.width, height/bg.height);
        const nw = bg.width*scale, nh = bg.height*scale;
        ctx.drawImage(bg, (width-nw)/2, (height-nh)/2, nw, nh);
    }

    gameState.spawnTimer += dt;
    if (gameState.spawnTimer > 2500 / gameState.speedMult) {
        gameState.trash.push(new Trash());
        gameState.spawnTimer = 0;
    }

    gameState.trash.forEach(t => { t.update(dt); t.draw(ctx); });
    gameState.trash = gameState.trash.filter(t => !t.remove);
    gameState.bins.forEach(b => b.draw(ctx));

    if (gameState.activeAnimal) {
        const a = gameState.activeAnimal; a.life -= dt/1000;
        if (a.scale < 1) a.scale += 0.1;
        const s = Math.min(width, height) * 0.4 * a.scale;
        ctx.drawImage(a.img, a.x - s/2, a.y - s/2, s, s);
        if (a.life <= 0) gameState.activeAnimal = null;
    }
    requestAnimationFrame(loop);
}

function startGame() {
    AudioSys.init();
    gameState = { score: 0, lives: 5, itemsSorted: 0, speedLevel: 1, speedMult: 1, isRunning: true, bins: [], trash: [], activeAnimal: null, spawnTimer: 2000, lastTime: performance.now(), lastLaunchTime: 0 };
    document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
    document.getElementById('score-el').innerText = '0';
    document.getElementById('speed-el').innerText = '1';
    resize(); updateHUD(); requestAnimationFrame(loop);
}

function endGame() { gameState.isRunning = false; document.getElementById('game-over-screen').classList.remove('hidden'); document.getElementById('final-score').innerText = "Счет: " + gameState.score; }

function resize() {
    width = window.innerWidth; height = window.innerHeight;
    canvas.width = width; canvas.height = height;
    cx = width / 2; cy = height * HORIZON_Y;
    const keys = Object.keys(TYPES);
    gameState.bins = keys.map((k, i) => new Bin(TYPES[k], i, keys.length));
}

window.addEventListener('resize', resize);
window.addEventListener('mousedown', onClick);
window.addEventListener('touchstart', (e) => { e.preventDefault(); onClick(e); }, {passive: false});
document.getElementById('start-btn').onclick = startGame;
document.getElementById('restart-btn').onclick = startGame;
Loader.init().then(() => resize());
</script>
</body>
</html>
