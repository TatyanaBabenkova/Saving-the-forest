<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Эко-Тропа: Реакция</title>
    <style>
        html { height: -webkit-fill-available; }
        body {
            margin: 0; padding: 0; overflow: hidden;
            background-color: #333;
            touch-action: none;
            font-family: 'Segoe UI', sans-serif;
            height: 100dvh; width: 100vw;
        }
        canvas { display: block; width: 100%; height: 100%; }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
        }

        .hud-panel {
            pointer-events: auto; background: rgba(0, 0, 0, 0.6);
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 20px; color: white; backdrop-filter: blur(5px);
        }

        #pause-btn {
            background: #FF9800; border: 2px solid #fff; color: white;
            border-radius: 15px; cursor: pointer; padding: 5px 15px;
        }

        /* Экраны */
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; z-index: 100; pointer-events: auto; text-align: center;
        }
        #start-screen { background: rgba(46, 125, 50, 0.9); }
        #game-over-screen { background: rgba(0, 0, 0, 0.85); }
        .hidden { display: none !important; }
        .btn {
            background: #4CAF50; border: none; padding: 15px 40px;
            color: white; font-size: 24px; cursor: pointer; border-radius: 15px;
            box-shadow: 0 6px 0 #2E7D32; font-weight: bold;
        }
        .btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #2E7D32; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="hud-panel">
            <div>Очки: <span id="score-el">0</span></div>
            <button id="pause-btn">ПАУЗА</button>
            <div id="lives-container"></div>
        </div>
    </div>

    <div id="start-screen" class="screen">
        <h1>Эко-Тропа</h1>
        <p>Кликай на бак, чтобы отправить в него ближайший мусор!</p>
        <button class="btn" id="start-btn">ИГРАТЬ</button>
    </div>

    <div id="game-over-screen" class="screen hidden">
        <h1>Конец игры</h1>
        <p id="final-score">Счет: 0</p>
        <button class="btn" id="restart-btn">ЗАНОГО</button>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
/**
 * НАСТРОЙКИ
 */
const ASSETS_PATH = 'IMG/';
const HORIZON_Y = 0.45; // Где начинается дорога (высота горизонта)

const TYPES = {
    ORGANIC: { id: 'organic', color: '#8BC34A', binImg: 'bin_organic.png', prefix: 'trash_apple' },
    PAPER:   { id: 'paper',   color: '#2196F3', binImg: 'bin_paper.png',   prefix: 'trash_newspaper' },
    PLASTIC: { id: 'plastic', color: '#FF9800', binImg: 'bin_plastic.png', prefix: 'trash_bottle' },
    METAL:   { id: 'metal',   color: '#9E9E9E', binImg: 'bin_met.png',     prefix: 'trash_can' },
    GLASS:   { id: 'glass',   color: '#00BCD4', binImg: 'bin_glass.png',   prefix: 'trash_jar' }
};

// Загрузчик (упрощенный для краткости)
const Loader = {
    images: {},
    async init() {
        const toLoad = {
            'bg': ASSETS_PATH + 'bg_forest.png',
            'leaf': ASSETS_PATH + 'leaf.png'
        };
        for (let k in TYPES) toLoad[`bin_${TYPES[k].id}`] = ASSETS_PATH + TYPES[k].binImg;
        
        // Загрузим хотя бы по паре видов мусора для теста
        for (let k in TYPES) {
            for (let i=1; i<=3; i++) toLoad[`${TYPES[k].prefix}${i}`] = `${ASSETS_PATH}${TYPES[k].prefix}${i}.png`;
        }

        for (let key in toLoad) {
            const img = new Image();
            img.src = toLoad[key];
            await new Promise(r => img.onload = r);
            this.images[key] = img;
        }
    },
    get(key) { return this.images[key]; }
};

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let width, height, cx, cy;

let gameState = {
    score: 0, lives: 5, speed: 1, 
    isRunning: false,
    bins: [], trash: [],
    spawnTimer: 0, lastTime: 0
};

class Bin {
    constructor(typeObj, index, total) {
        this.type = typeObj;
        this.scale = 1.0;
        this.recalculate(index, total);
    }

    recalculate(index, total) {
        // Баки внизу экрана, притоплены на 1/3
        const gap = width / total;
        this.w = Math.min(gap * 0.8, 150);
        this.h = this.w * 1.3;
        this.x = (index * gap) + (gap / 2) - (this.w / 2);
        this.y = height - (this.h * 0.7); // 70% высоты снаружи, остальное "за экраном"
    }

    draw(ctx) {
        ctx.save();
        const drawW = this.w * this.scale;
        const drawH = this.h * this.scale;
        const img = Loader.get(`bin_${this.type.id}`);
        
        // Центрирование при увеличении
        const offsetX = (drawW - this.w) / 2;
        const offsetY = (drawH - this.h) / 2;

        if (img) ctx.drawImage(img, this.x - offsetX, this.y - offsetY, drawW, drawH);
        ctx.restore();
        
        if (this.scale > 1.0) this.scale -= 0.05; // Возвращаем размер
    }

    isClicked(px, py) {
        return px > this.x && px < this.x + this.w && py > this.y;
    }
}

class Trash {
    constructor() {
        const keys = Object.keys(TYPES);
        this.type = TYPES[keys[Math.floor(Math.random() * keys.length)]];
        this.skin = Math.floor(Math.random() * 3) + 1;
        this.progress = 0; // 0 - горизонт, 1 - игрок
        this.lane = (Math.random() - 0.5) * 2; // Разброс по дороге
        
        this.flying = false; // Летит ли в бак
        this.flyProgress = 0;
        this.startX = 0; this.startY = 0;
        this.targetBin = null;
    }

    update(dt) {
        if (this.flying) {
            this.flyProgress += 0.08; 
            if (this.flyProgress >= 1) this.onReachBin();
            return;
        }

        this.progress += 0.002 * gameState.speed * (dt / 16);
        if (this.progress > 1.0) {
            this.remove = true;
            handleMiss();
        }
    }

    onReachBin() {
        this.remove = true;
        if (this.targetBin.type.id === this.type.id) {
            gameState.score += 10;
        } else {
            gameState.score = Math.max(0, gameState.score - 5);
            handleMiss();
        }
        document.getElementById('score-el').innerText = gameState.score;
    }

    draw(ctx) {
        let x, y, size;
        const minDim = Math.min(width, height);

        if (this.flying) {
            // Полет по кривой Безье (простая интерполяция с "горбом")
            const t = this.flyProgress;
            const targetX = this.targetBin.x + this.targetBin.w / 2;
            const targetY = this.targetBin.y + this.targetBin.h / 3;
            
            x = this.startX + (targetX - this.startX) * t;
            // Делаем дугу: вычитаем значение параболы из Y
            y = this.startY + (targetY - this.startY) * t - Math.sin(t * Math.PI) * 100;
            size = minDim * 0.15;
        } else {
            // Обычное движение по дороге
            const p = this.progress;
            x = cx + (this.lane * (width * 0.4) * p);
            y = cy + (height - cy) * p;
            size = (minDim * 0.3) * (0.2 + p * 0.8);
        }

        const img = Loader.get(`${this.type.prefix}${this.skin}`);
        if (img) ctx.drawImage(img, x - size/2, y - size/2, size, size);
    }
}

function handleMiss() {
    gameState.lives--;
    updateLivesHUD();
    if (gameState.lives <= 0) endGame();
}

function updateLivesHUD() {
    const container = document.getElementById('lives-container');
    container.innerHTML = '❤️'.repeat(gameState.lives);
}

function onClick(e) {
    if (!gameState.isRunning) return;
    const px = e.clientX || e.touches[0].clientX;
    const py = e.clientY || e.touches[0].clientY;

    const clickedBin = gameState.bins.find(b => b.isClicked(px, py));
    
    if (clickedBin) {
        clickedBin.scale = 1.3; // Эффект нажатия
        
        // Ищем самый ближний мусор (максимальный progress), который еще не летит
        let nearest = gameState.trash
            .filter(t => !t.flying && t.progress > 0.1)
            .sort((a, b) => b.progress - a.progress)[0];

        if (nearest) {
            // Рассчитываем текущие экранные координаты для начала полета
            const p = nearest.progress;
            nearest.startX = cx + (nearest.lane * (width * 0.4) * p);
            nearest.startY = cy + (height - cy) * p;
            
            nearest.flying = true;
            nearest.targetBin = clickedBin;
        }
    }
}

function loop(time) {
    if (!gameState.isRunning) return;
    const dt = time - gameState.lastTime;
    gameState.lastTime = time;

    ctx.clearRect(0, 0, width, height);
    
    // Фон
    const bg = Loader.get('bg');
    if (bg) ctx.drawImage(bg, 0, 0, width, height);

    // Спавн
    gameState.spawnTimer += dt;
    if (gameState.spawnTimer > 2000 / gameState.speed) {
        gameState.trash.push(new Trash());
        gameState.spawnTimer = 0;
    }

    // Мусор
    gameState.trash.forEach(t => {
        t.update(dt);
        t.draw(ctx);
    });
    gameState.trash = gameState.trash.filter(t => !t.remove);

    // Баки (всегда сверху мусора)
    gameState.bins.forEach(b => b.draw(ctx));

    requestAnimationFrame(loop);
}

function startGame() {
    gameState.isRunning = true;
    gameState.score = 0;
    gameState.lives = 5;
    gameState.trash = [];
    gameState.speed = 1;
    gameState.lastTime = performance.now();
    
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('game-over-screen').classList.add('hidden');
    
    resize();
    updateLivesHUD();
    requestAnimationFrame(loop);
}

function endGame() {
    gameState.isRunning = false;
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('final-score').innerText = "Счет: " + gameState.score;
}

function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
    cx = width / 2;
    cy = height * HORIZON_Y;

    // Создаем баки в ряд
    const keys = Object.keys(TYPES);
    gameState.bins = keys.map((k, i) => new Bin(TYPES[k], i, keys.length));
}

window.addEventListener('resize', resize);
window.addEventListener('mousedown', onClick);
window.addEventListener('touchstart', onClick);
document.getElementById('start-btn').onclick = startGame;
document.getElementById('restart-btn').onclick = startGame;

Loader.init().then(() => {
    resize();
    console.log("Assets loaded");
});

</script>
</body>
</html>
