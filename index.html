<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Эко-Тропа: Сортировка</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #333;
            touch-action: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .hud {
            padding: 20px;
            color: white;
            text-shadow: 2px 2px 4px black;
            font-size: 32px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 5;
            pointer-events: auto;
        }
        .hud-left {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        #pause-btn {
            background: #FF9800;
            border: 2px solid #fff;
            color: white;
            font-size: 18px;
            padding: 5px 15px;
            border-radius: 20px;
            cursor: pointer;
            width: fit-content;
            font-weight: bold;
            pointer-events: auto;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }
        #pause-btn:active { transform: scale(0.95); }
        
        #start-screen, #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 10;
            pointer-events: auto;
        }
        .btn {
            background: #4CAF50;
            border: none;
            padding: 20px 60px;
            color: white;
            font-size: 30px;
            cursor: pointer;
            border-radius: 15px;
            margin-top: 30px;
            transition: transform 0.1s;
            font-weight: bold;
            box-shadow: 0 6px 0 #2E7D32;
        }
        .btn:active { transform: scale(0.95); box-shadow: 0 3px 0 #2E7D32; }
        h1 { font-size: 60px; margin-bottom: 20px; text-align: center; text-shadow: 0 5px 10px rgba(0,0,0,0.5); }
        .hidden { display: none !important; }
        
        #pause-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 60px;
            font-weight: bold;
            text-shadow: 0 5px 15px black;
            z-index: 8;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 5px;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="hud">
            <div class="hud-left">
                <span id="score-el">Очки: 0</span>
                <button id="pause-btn">II Пауза</button>
            </div>
            <span id="lives-el">Жизни: 5</span>
        </div>
    </div>

    <div id="pause-overlay" class="hidden">ПАУЗА</div>

    <div id="start-screen">
        <h1>Эко-Тропа</h1>
        <p style="font-size: 24px;">Сортируй мусор, спасай лес!</p>
        <button class="btn" id="start-btn">В Путь</button>
    </div>

    <div id="game-over-screen" class="hidden">
        <h1>Конец игры</h1>
        <p id="final-score" style="font-size: 30px;">Твой счет: 0</p>
        <button class="btn" id="restart-btn">Заново</button>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
/**
 * НАСТРОЙКИ
 */
const ASSETS_PATH = 'IMG/'; 
const HORIZON_Y = 0.44; 

const TYPES = {
    ORGANIC: { id: 'organic', color: '#8BC34A', binImg: 'bin_organic.png', prefix: 'trash_apple' },
    PAPER:   { id: 'paper',   color: '#2196F3', binImg: 'bin_paper.png',   prefix: 'trash_newspaper' },
    PLASTIC: { id: 'plastic', color: '#FF9800', binImg: 'bin_plastic.png', prefix: 'trash_bottle' },
    METAL:   { id: 'metal',   color: '#9E9E9E', binImg: 'bin_met.png',     prefix: 'trash_can' },
    GLASS:   { id: 'glass',   color: '#00BCD4', binImg: 'bin_glass.png',   prefix: 'trash_jar' }
};

const DECOR_TYPES = [
    { prefix: 'tree', count: 5, scale: 6.0, type: 'tree' }, 
    { prefix: 'bush', count: 5, scale: 2.0, type: 'bush' }, 
    { prefix: 'flower', count: 5, scale: 1.0, type: 'flower' } 
];

const AudioSys = {
    ctx: null,
    init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
    playTone(freq, type, duration, vol=0.1) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
    },
    playSuccess() { this.playTone(500, 'sine', 0.1); setTimeout(() => this.playTone(1000, 'sine', 0.2), 100); },
    playError() { this.playTone(150, 'sawtooth', 0.3, 0.2); },
    playPop() { this.playTone(600, 'triangle', 0.05, 0.05); }
};

const Loader = {
    images: {},
    loadImg(key, src) {
        return new Promise((resolve) => {
            const img = new Image();
            img.src = src;
            img.onload = () => { this.images[key] = { img: img, loaded: true }; resolve(); };
            img.onerror = () => { this.images[key] = { img: null, loaded: false }; resolve(); };
        });
    },
    async init() {
        const promises = [this.loadImg('bg', ASSETS_PATH + 'bg_forest.png')];
        for (let key in TYPES) promises.push(this.loadImg(`bin_${TYPES[key].id}`, ASSETS_PATH + TYPES[key].binImg));
        for (let key in TYPES) {
            for (let i = 1; i <= 5; i++) promises.push(this.loadImg(`${TYPES[key].prefix}${i}`, `${ASSETS_PATH}${TYPES[key].prefix}${i}.png`));
        }
        DECOR_TYPES.forEach(d => {
            for (let i = 1; i <= 5; i++) promises.push(this.loadImg(`${d.prefix}${i}`, `${ASSETS_PATH}${d.prefix}${i}.png`));
        });
        await Promise.all(promises);
    },
    get(key) { return this.images[key]; }
};

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let width, height, cx, cy;

let gameState = {
    score: 0, lives: 5, speed: 1, isRunning: false, isPaused: false,
    bins: [], trash: [], decor: [], particles: [],
    lastTime: 0, spawnTimer: 0, decorTimer: 0
};

class Prop {
    constructor(isTrash) {
        this.isTrash = isTrash;
        this.markedForDeletion = false;
        this.baseSpeed = isTrash ? 0.002 : 0.0006; 
        this.progress = 0; 
        this.startX = cx;
        this.targetX = cx;

        if (isTrash) {
            this.startX = cx + (Math.random() - 0.5) * 50; 
            this.targetX = cx + (Math.random() - 0.5) * (width * 0.4); 
        } 
    }

    update(dt) {
        if (this.isTrash) {
            this.progress += this.baseSpeed * gameState.speed * (dt / 16);
        }
    }

    checkVisibility(x, y, size) {
        if (this.isTrash) {
            if (this.progress > 1.1) {
                this.markedForDeletion = true;
                handleMiss();
            }
        } 
    }

    getScreenPos() {
        let scaleCurve;
        if (this.isTrash) {
             scaleCurve = this.progress * this.progress;
        } else {
             scaleCurve = 0.1 + (this.progress * this.progress * 0.45);
        }
        
        const curY = cy + (height - cy) * this.progress;
        const curX = this.startX + (this.targetX - this.startX) * this.progress;

        return { x: curX, y: curY, scale: scaleCurve };
    }
}

class Trash extends Prop {
    constructor() {
        super(true);
        const keys = Object.keys(TYPES);
        this.type = TYPES[keys[Math.floor(Math.random() * keys.length)]];
        this.skinId = Math.floor(Math.random() * 5) + 1;
        this.isDragging = false;
        this.dragX = 0; this.dragY = 0;
    }

    update(dt) {
        if (!this.isDragging) {
            super.update(dt);
            const pos = this.getScreenPos();
            const size = 220 * pos.scale; 
            this.checkVisibility(pos.x, pos.y, size);
        }
    }

    draw(ctx) {
        const pos = this.getScreenPos();
        let drawX = this.isDragging ? this.dragX : pos.x;
        let drawY = this.isDragging ? this.dragY : pos.y;
        let finalScale = this.isDragging ? 1.0 : pos.scale;
        
        if (finalScale < 0.05) return;

        let size = 220 * finalScale; 

        const res = Loader.get(`${this.type.prefix}${this.skinId}`);
        ctx.save();
        ctx.translate(drawX, drawY);
        
        if (!this.isDragging) {
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(0, size/2, size/3, size/6, 0, 0, Math.PI*2);
            ctx.fill();
        }

        if (res && res.loaded) {
            ctx.drawImage(res.img, -size/2, -size/2, size, size);
        } else {
            ctx.fillStyle = this.type.color;
            ctx.beginPath();
            ctx.arc(0, 0, size/2.5, 0, Math.PI*2);
            ctx.fill();
        }
        ctx.restore();
    }
}

class Decor extends Prop {
    constructor(forcedProgress = null, forcedType = null) {
        super(false);
        const types = DECOR_TYPES;
        
        let t;
        if (forcedType) {
            t = types.find(type => type.type === forcedType) || types[0];
        } else {
             const rand = Math.random();
             if (rand < 0.4) t = types[0]; 
             else if (rand < 0.7) t = types[1]; 
             else t = types[2]; 
        }

        this.skinId = Math.floor(Math.random() * 5) + 1;
        this.prefix = t.prefix;
        this.baseScale = t.scale;
        this.decorType = t.type;
        
        this.sizeVar = 0.8 + Math.random() * 0.5; 
        
        if (forcedProgress !== null) {
            this.progress = forcedProgress;
        } else {
            this.progress = Math.random();
        }

        // Асимметрия и позиционирование
        const isLeft = Math.random() > 0.5;
        let offset;
        
        if (isLeft) {
             offset = width * 0.85 + Math.random() * width * 0.4;
             this.startX = cx - offset;
        } else {
             offset = width * 0.55 + Math.random() * width * 0.4;
             this.startX = cx + offset;
        }
        
        // Для основной массы (не кулис) пересчитываем позицию более умно
        if (!forcedType && forcedProgress === null) {
             const sideSign = Math.random() > 0.5 ? -1 : 1;
             const roadWidth = (width * 0.02) + (width * 0.25 * this.progress);
             const minX = roadWidth + (width * 0.05); 
             const maxX = width * 0.6 + (width * 0.5 * this.progress);
             const xOffset = minX + Math.random() * (maxX - minX);
             this.startX = cx + (sideSign * xOffset);
        }

        this.targetX = this.startX;
    }

    update(dt) {
        super.update(dt);
    }

    draw(ctx) {
        const pos = this.getScreenPos();
        let size = 350 * pos.scale * this.baseScale * this.sizeVar;
        
        const res = Loader.get(`${this.prefix}${this.skinId}`);
        if (res && res.loaded) {
            ctx.drawImage(res.img, pos.x - size/2, pos.y - size, size, size);
        } else {
            ctx.fillStyle = '#1B5E20';
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, size/4, 0, Math.PI*2);
            ctx.fill();
        }
    }
}

class Bin {
    constructor(typeObj, index, total) {
        this.type = typeObj;
        const margin = 20;
        const availableW = width - (margin * 2);
        const binW = availableW / total;
        
        // === ИСПРАВЛЕНИЕ: БАКИ В 1.5 РАЗА БОЛЬШЕ ===
        // Увеличили максимальный размер со 160 до 240
        // И используем большую часть ширины слота
        this.w = Math.min(240, binW - 10); 
        this.h = this.w * 1.3;
        
        this.x = margin + (index * binW) + (binW / 2) - (this.w / 2);
        this.y = 15;
    }
    // Проверка попадания с запасом (+30 пикселей вокруг)
    checkHit(x, y) { 
        return x > this.x - 30 && 
               x < this.x + this.w + 30 && 
               y > this.y - 30 && 
               y < this.y + this.h + 30; 
    }
    draw(ctx) {
        const res = Loader.get(`bin_${this.type.id}`);
        if (res && res.loaded) ctx.drawImage(res.img, this.x, this.y, this.w, this.h);
        else {
            ctx.fillStyle = this.type.color;
            ctx.fillRect(this.x, this.y, this.w, this.h);
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
            ctx.strokeRect(this.x, this.y, this.w, this.h);
            ctx.fillStyle = 'white';
            ctx.textAlign = 'center';
            ctx.font = 'bold 24px Arial';
            ctx.fillText(this.type.id.toUpperCase(), this.x + this.w/2, this.y + this.h/2);
        }
    }
}

class Particle {
    constructor(x, y, color) {
        this.x = x; this.y = y;
        this.vx = (Math.random() - 0.5) * 20;
        this.vy = (Math.random() - 0.5) * 20;
        this.life = 1.0; this.color = color;
    }
    update() { this.x += this.vx; this.y += this.vy; this.life -= 0.05; }
    draw(ctx) {
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.beginPath(); ctx.arc(this.x, this.y, 10, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
    }
}

let dragItem = null;

function handleStart(x, y) {
    if (!gameState.isRunning || gameState.isPaused) return;
    
    let candidates = gameState.trash.filter(t => t.progress > 0.3);
    candidates.sort((a,b) => b.progress - a.progress);

    for (let t of candidates) {
        const pos = t.getScreenPos();
        const size = 220 * pos.scale; 
        const dx = x - pos.x;
        const dy = y - pos.y;
        
        if (Math.sqrt(dx*dx + dy*dy) < size) { 
            dragItem = t;
            t.isDragging = true;
            t.dragX = x; t.dragY = y;
            AudioSys.playPop();
            break; 
        }
    }
}

function handleMove(x, y) { if (dragItem) { dragItem.dragX = x; dragItem.dragY = y; } }

function handleEnd(x, y) {
    if (dragItem) {
        let hitBin = gameState.bins.find(b => b.checkHit(x, y));
        if (hitBin) {
            if (hitBin.type.id === dragItem.type.id) {
                gameState.score += 10;
                AudioSys.playSuccess();
                createParticles(x, y, hitBin.type.color);
            } else {
                gameState.score = Math.max(0, gameState.score - 5);
                AudioSys.playError();
                createParticles(x, y, '#555');
                triggerShake();
            }
            dragItem.markedForDeletion = true;
        } else {
            dragItem.isDragging = false;
        }
        updateHUD();
        dragItem = null;
    }
}

const pauseBtn = document.getElementById('pause-btn');
const pauseOverlay = document.getElementById('pause-overlay');

pauseBtn.onclick = () => {
    gameState.isPaused = !gameState.isPaused;
    if (gameState.isPaused) {
        pauseBtn.textContent = "▶ Продолжить";
        pauseOverlay.classList.remove('hidden');
    } else {
        pauseBtn.textContent = "II Пауза";
        pauseOverlay.classList.add('hidden');
        gameState.lastTime = performance.now(); 
        requestAnimationFrame(loop);
    }
};

window.addEventListener('resize', resize);
canvas.addEventListener('mousedown', e => handleStart(e.clientX, e.clientY));
canvas.addEventListener('mousemove', e => handleMove(e.clientX, e.clientY));
canvas.addEventListener('mouseup', e => handleEnd(e.clientX, e.clientY));
canvas.addEventListener('touchstart', e => { e.preventDefault(); handleStart(e.touches[0].clientX, e.touches[0].clientY); }, {passive: false});
canvas.addEventListener('touchmove', e => { e.preventDefault(); handleMove(e.touches[0].clientX, e.touches[0].clientY); }, {passive: false});
canvas.addEventListener('touchend', e => { e.preventDefault(); handleEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY); });

document.getElementById('start-btn').onclick = startGame;
document.getElementById('restart-btn').onclick = startGame;

function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
    cx = width / 2;
    cy = height * HORIZON_Y; 
    gameState.bins = [];
    createBins();
}

function createBins() {
    let i = 0; const count = Object.keys(TYPES).length;
    for (let key in TYPES) gameState.bins.push(new Bin(TYPES[key], i++, count));
}

function createParticles(x, y, c) { for(let i=0; i<15; i++) gameState.particles.push(new Particle(x, y, c)); }
function handleMiss() { 
    gameState.lives--; 
    AudioSys.playError(); 
    triggerShake(); 
    updateHUD(); 
    if (gameState.lives <= 0) gameOver(); 
}

let shakeTimer = 0;
function triggerShake() { shakeTimer = 15; }
function updateHUD() {
    document.getElementById('score-el').textContent = `Очки: ${gameState.score}`;
    document.getElementById('lives-el').textContent = `Жизни: ${gameState.lives}`;
}
function gameOver() {
    gameState.isRunning = false;
    document.getElementById('game-over-screen').classList.remove('hidden');
    document.getElementById('final-score').textContent = `Итоговый: ${gameState.score}`;
}

// === СТАТИЧНАЯ ГЕНЕРАЦИЯ ЛЕСА ===
function populateForest() {
    gameState.decor = []; 
    
    // 1. ЗАДНИЙ ПЛАН
    for(let i=0; i<30; i++) {
        const p = 0.1 + Math.random() * 0.15; 
        gameState.decor.push(new Decor(p, 'tree'));
    }

    // 2. БОКА (Кулисы)
    for(let i=0; i<15; i++) {
        const p = 0.4 + Math.random() * 0.6;
        const d = new Decor(p, 'tree');
        
        // Исправленная асимметрия
        const isLeft = Math.random() > 0.5;
        let offset;
        if (isLeft) {
             offset = width * 0.85 + Math.random() * width * 0.4;
             d.startX = cx - offset;
        } else {
             offset = width * 0.55 + Math.random() * width * 0.4;
             d.startX = cx + offset;
        }
        
        d.targetX = d.startX; 
        gameState.decor.push(d);
    }

    // 3. ОСНОВНАЯ МАССА
    for(let i=0; i<150; i++) {
        const p = 0.05 + Math.random() * 0.95; 
        gameState.decor.push(new Decor(p, null)); 
    }
}

function startGame() {
    AudioSys.init();
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('game-over-screen').classList.add('hidden');
    pauseOverlay.classList.add('hidden');
    pauseBtn.textContent = "II Пауза";
    
    gameState = {
        score: 0, lives: 5, speed: 1, isRunning: true, isPaused: false,
        bins: [], trash: [], decor: [], particles: [],
        lastTime: performance.now(), spawnTimer: 0, decorTimer: 0
    };
    
    createBins(); 
    updateHUD(); 
    resize();
    populateForest(); 
    requestAnimationFrame(loop);
}

function loop(time) {
    if (!gameState.isRunning) return;
    if (gameState.isPaused) return; 

    const dt = time - gameState.lastTime;
    gameState.lastTime = time;

    ctx.clearRect(0, 0, width, height);

    const bgRes = Loader.get('bg');
    if (bgRes && bgRes.loaded) ctx.drawImage(bgRes.img, 0, 0, width, height);
    else {
        const grad = ctx.createLinearGradient(0, 0, 0, height);
        grad.addColorStop(0, '#87CEEB'); grad.addColorStop(HORIZON_Y, '#ccc'); 
        grad.addColorStop(HORIZON_Y, '#2E7D32'); grad.addColorStop(1, '#1B5E20');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, width, height);
    }

    if (shakeTimer > 0) {
        ctx.save();
        ctx.translate((Math.random()-0.5)*15, (Math.random()-0.5)*15);
        shakeTimer--;
    }

    gameState.spawnTimer += dt;
    gameState.speed = 1 + (gameState.score / 250); 

    if (gameState.spawnTimer > 2500 / gameState.speed) {
        gameState.trash.push(new Trash());
        gameState.spawnTimer = 0;
    }
    
    gameState.decor.forEach(d => d.update(dt));
    gameState.trash.forEach(t => t.update(dt));
    
    gameState.trash = gameState.trash.filter(t => !t.markedForDeletion);

    // === ИСПРАВЛЕННАЯ СОРТИРОВКА (СЛОИ) ===
    // Просто сортируем по прогрессу: то что ниже (больше progress) - рисуется последним
    gameState.decor.sort((a,b) => a.progress - b.progress);

    gameState.decor.forEach(d => d.draw(ctx));

    gameState.trash.sort((a,b) => {
        if (a.isDragging) return 1; if (b.isDragging) return -1;
        return a.progress - b.progress;
    });
    gameState.trash.forEach(t => t.draw(ctx));

    gameState.bins.forEach(b => b.draw(ctx));
    gameState.particles.forEach(p => { p.update(); p.draw(ctx); });
    gameState.particles = gameState.particles.filter(p => p.life > 0);

    if (shakeTimer > 0) ctx.restore();
    requestAnimationFrame(loop);
}

Loader.init().then(() => { resize(); console.log("Ready"); });

</script>
</body>
</html>
